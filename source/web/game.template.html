<style>
/*__FONTS__*/
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Concept : un écran de régie de tournoi. Une piste de saison en haut, la décision au centre, les chiffres sur le côté. Thème sombre unique, assumé. */
:root{
  color-scheme:dark;
  --bg:#0d1619; --panel:#142127; --panel2:#1b2b32; --line:#2c3f47;
  --fg:#eaf0f1; --dim:#93a7ae; --accent:#f5a524; --accent-ink:#1b1204;
  --win:#55d394; --loss:#ff7a6b;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.5 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
#app{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.dim{color:var(--dim)}
.fic{color:var(--dim);font-size:.8em}

/* Barre du haut */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;border-bottom:1px solid var(--line);padding-bottom:12px}
.ovr{font:900 58px/.85 var(--display);color:var(--accent)}
.who{min-width:0;flex:1 1 200px}
.who h1{font-size:30px;overflow-wrap:anywhere}
.wrank{color:var(--accent);font-size:.8em}
.flag{margin-right:5px;font-style:normal;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
table.palm tfoot td{font-weight:700;border-top:1px solid var(--accent);border-bottom:0}
table.palm th:first-child,table.palm td:first-child{width:auto}
.nums{display:flex;flex-wrap:wrap;gap:6px 20px}
.nums b{display:block;font:800 25px/1 var(--display)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{padding:8px 13px;font:800 19px/1 var(--display);color:var(--dim);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current=true]{color:var(--fg);border-color:var(--accent)}

/* Piste de saison */
.track{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.tick{height:34px;background:var(--panel);display:grid;place-items:center;font:600 10px/1 var(--mono);color:var(--dim);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%,7px 50%);padding-inline:9px 7px;text-align:center}
.tick.done{background:var(--panel2);color:var(--fg)}
.tick.now{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tick.skip{opacity:.4;text-decoration:line-through}
@media(max-width:640px){nav button{padding:8px 6px;font-size:15.5px}.tick{font-size:0}.tick::after{content:attr(data-s);font-size:10px}.tick{height:26px}}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.cols>*{min-width:0}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}

/* Décision */
.scene h2{font-size:clamp(32px,6vw,46px);font-weight:900;margin-block:4px 8px}
.scene>p{max-width:62ch}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:block;width:100%;padding:13px 16px;background:var(--panel);border-left:3px solid var(--line);transition:background .12s,border-color .12s}
.opt:hover{background:var(--panel2);border-left-color:var(--accent)}
.opt strong{display:block;font-weight:600;font-size:17px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font:500 12px/1.4 var(--mono)}
.up{color:var(--win)}.down{color:var(--loss)}.neutral{color:var(--accent)}

/* Résultat d'événement */
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;background:var(--panel);padding:13px 16px}
.ev .rank{grid-row:span 2;font:900 54px/.9 var(--display);color:var(--fg)}
.ev.gold .rank{color:var(--accent)}
.ev h3{font-size:23px}
.runs{display:flex;flex-direction:column;gap:1px;font:400 13px/1.45 var(--mono)}
.flash{font-size:15px;padding-left:12px;border-left:3px solid var(--line);max-width:68ch}
.flash.ok{border-color:var(--win)}.flash.bad{border-color:var(--loss)}.flash.note{border-color:var(--accent)}
.news{background:var(--panel);padding:11px 16px;font-size:14px}
.news ul{margin:5px 0 0;padding-left:18px}

/* Colonne */
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:14px;margin-top:6px}
.bar i{display:block;height:7px;background:var(--panel2)}
.bar i span{display:block;height:100%;background:var(--accent)}
.bar i span.soft{background:var(--dim)}
.bar .mono{text-align:right;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--panel2);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:left;color:var(--dim);width:24px}
tr.mine td{background:var(--panel2);color:var(--accent);font-weight:600}
tr.cut td{border-bottom-color:var(--accent)}
.feed{list-style:none;margin:6px 0 0;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.feed li{padding-left:10px;border-left:2px solid var(--line)}
.feed time{font:400 11px var(--mono);color:var(--dim);display:block}
.scroll{overflow-x:auto}

/* Offres et équipes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:10px}
.card{background:var(--panel);padding:13px 15px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{font-size:25px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 span{font-size:22px;color:var(--accent)}
.card.me{outline:1px solid var(--accent)}
.card h3.tband{margin:-13px -15px 4px;padding:9px 15px;align-items:center}
.card h3.tband span{color:inherit}
.badge{display:inline-grid;place-items:center;width:25px;height:27px;margin-right:7px;padding-bottom:4px;vertical-align:middle;flex:none;font:800 10.5px/1 var(--display);letter-spacing:.01em;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
.badge.big{width:37px;height:41px;margin-right:0;padding-bottom:6px;font-size:15px}
.tname{display:flex;align-items:center;gap:10px;min-width:0}
.card ol{list-style:none;margin:0;padding:0;font-size:14.5px}
.card ol li{display:flex;justify-content:space-between;gap:8px;padding-block:2px}
.card ol li.me{color:var(--accent);font-weight:600}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);font:800 21px/1 var(--display);padding:11px 18px;text-align:center;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn:hover{filter:brightness(1.1)}
.ghost{color:var(--dim);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.ghost:hover{color:var(--fg)}
.offer{cursor:pointer;width:100%;border-left:3px solid var(--line);transition:background .12s,border-color .12s}
.offer:hover{background:var(--panel2);border-left-color:var(--accent)}
.offer.keep{border-left-color:var(--accent);background:var(--panel2);max-width:460px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv span:last-child{font-family:var(--mono);font-size:13px;text-align:right}
.tiles{display:flex;flex-wrap:wrap;gap:8px 26px;background:var(--panel);padding:12px 16px}
.tiles b{display:block;font:800 30px/1 var(--display)}

/* Création */
.hero{padding-block:16px 2px}
.hero h1{font-size:clamp(62px,14vw,136px);font-weight:900;color:var(--accent);line-height:.84}
.hero p{max-width:60ch;margin-top:12px;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],select{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:11px 12px;font:600 17px var(--body);width:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:520px){.two{grid-template-columns:minmax(0,1fr)}}
.pickrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.pick{padding:11px 13px;background:var(--panel);border-left:3px solid var(--line);font-size:13.5px;color:var(--dim)}
.pick strong{display:block;color:var(--fg);font-size:16px;font-weight:600;line-height:1.25;margin-bottom:2px}
.pick[aria-pressed=true]{border-color:var(--accent);background:var(--panel2)}
textarea{width:100%;min-height:110px;background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:10px;font:400 13px/1.4 var(--mono)}
.conf{background:var(--panel);padding:12px 15px;display:flex;flex-direction:column;gap:6px;font-size:14px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.btn2{background:var(--panel2);padding:10px 14px;font-weight:600;font-size:15px}
.btn2:hover{background:var(--line)}
.reveal{background:var(--panel);padding:16px 18px;border-top:4px solid var(--accent);display:flex;flex-direction:column;gap:6px}
.reveal.good{border-top-color:var(--win)}.reveal.bad{border-top-color:var(--loss)}
.reveal h2{font-size:clamp(38px,9vw,56px);font-weight:900}
.reveal.good h2{color:var(--win)}.reveal.bad h2{color:var(--loss)}
.fxlist{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.fxrow{animation:fxin .35s ease-out both}
.fxtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:600;font-size:17px}
.fxtop b{font:900 34px/1 var(--display)}
.fxrow.major .fxtop b{font-size:42px}
.fxbar{display:block;height:9px;background:var(--panel2);margin-top:4px}
.fxbar span{display:block;height:100%;background:var(--win);width:var(--to);animation:fxgrow .7s ease-out both}
.fxbar span.neg{background:var(--loss)}
.fxval{font-size:12px;color:var(--dim);margin-top:3px}
@keyframes fxin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fxgrow{from{width:var(--from)}to{width:var(--to)}}
.hcard{background:var(--panel);padding:13px 15px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hcard h3.tband{margin:-13px -15px 4px;padding:9px 15px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:25px}
.hcard h3.tband span{color:inherit}
.hcard.lead{outline:2px solid var(--accent)}
.hname{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:20px}
.pill{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;background:var(--panel2);color:var(--dim);margin-left:auto}
.pill.on{color:var(--accent-ink);background:var(--accent)}
.retire-card{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-left:3px solid var(--loss)}
.retire-card h3{font-size:26px}
.tagrow{display:flex;gap:8px;align-items:stretch}
.tagrow input{min-width:0;flex:1}
.tagrow .btn2{flex:none;white-space:nowrap}
.fine{font-size:13px;color:var(--dim);max-width:75ch}
section{min-width:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="app"></div>
<script>
/*__CORE__*/
const DEFAULT_CONTENT=/*__DEFAULT_CONTENT__*/null;
const STEPS=[["prep","Intersaison","P"],["m0","Major I","1"],["off","Hors-jeu","H"],["m1","Major II","2"],["train","Training","T"],["m2","Major III","3"],["off","Hors-jeu","H"],["m3","Major IV","4"],["champs","Champs","C"],["merc","Mercato","M"]];
const STAT={aim:"Aim",move:"Mouvement",sense:"Game sense",mental:"Mental",morale:"Moral",fame:"Popularité",money:"Argent",form:"Forme",chem:"Coéquipiers"};
const D=()=>({...DEFAULT_CONTENT.rules.difficulty,...(RULES&&RULES.difficulty||{})});
const TAGS={},COLORS={},PLAYER_NATS={},REAL_NAMES=new Set(["Arian"]); // Arian reste dans les carrières déjà commencées
const NAT_CODES={"France":"FR","Belgique":"BE","Suisse":"CH","Canada":"CA","Québec":"CA","États-Unis":"US","Royaume-Uni":"GB","Espagne":"ES","Portugal":"PT","Italie":"IT","Allemagne":"DE","Pays-Bas":"NL","Maroc":"MA","Algérie":"DZ","Tunisie":"TN","Sénégal":"SN","Mexique":"MX","Brésil":"BR","Japon":"JP","Australie":"AU"};
const FICTIONAL_NATS=["US","US","US","GB","CA","FR","ES","DE","IT","AU","MX","BR","NL","BE","PT","MA"];
const collectColors=c=>{c.teams.cdl.concat(c.teams.challengers).forEach(t=>{if(t.color)COLORS[t.id]=t.color;if(t.tag)TAGS[t.id]=t.tag});c.teams.cdl.flatMap(t=>t.players).concat(c.teams.freeAgents||[]).forEach(p=>{REAL_NAMES.add(p.name);if(p.nat)PLAYER_NATS[p.name]=p.nat})};
const natCode=n=>{if(PLAYER_NATS[n])return PLAYER_NATS[n];if(REAL_NAMES.has(n))return null;let h=0;for(const c of n)h=(h*31+c.codePointAt(0))>>>0;return FICTIONAL_NATS[h%FICTIONAL_NATS.length]};
const flagOf=code=>code?`<span class="flag" aria-hidden="true">${[...code].map(c=>String.fromCodePoint(0x1F1E6+c.charCodeAt(0)-65)).join("")}</span>`:"";
const pFlag=p=>p.me?flagOf(NAT_CODES[S.me.nat]):flagOf(natCode(p.n));
const tColor=id=>COLORS[id]||"#5b6b72";
function tInk(id){const h=tColor(id).slice(1),n=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*n[0]+.7152*n[1]+.0722*n[2]>.28?"#10181b":"#ffffff"}
const tTag=id=>TAGS[id]||id;
const tDot=id=>`<span class="badge" aria-hidden="true" style="background:${tColor(id)};color:${tInk(id)}">${tTag(id)}</span>`;
const tBand=(id,name,val)=>`<h3 class="tband" style="background:${tColor(id)};color:${tInk(id)}"><span class="tname"><span class="badge big" aria-hidden="true" style="background:${tInk(id)};color:${tColor(id)}">${tTag(id)}</span><span>${name}</span></span><span>${val}</span></h3>`;
let CDL0,FA0,CH0,SYL1,SYL2,ROLES,ORIG,NATS,STARTERS,PREP,TRAIN,OFF,CLUTCH,POOLS,RULES;
function hydrate(c){
 collectColors(DEFAULT_CONTENT);collectColors(c);
 CDL0=c.teams.cdl.map(t=>[t.id,t.name,t.prestige,t.players.map(p=>[p.name,p.rating])]);
 CH0=c.teams.challengers.map(t=>[t.id,t.name,t.prestige]);
 FA0=(c.teams.freeAgents||[]).map(p=>[p.name,p.rating]);
 SYL1=c.names.prefixes;SYL2=c.names.suffixes;NATS=c.nationalities;
 STARTERS=c.starterTeams.map(s=>{const t=c.teams.challengers.find(x=>x.id===s.id);return[s.id,t.name,s.text]});
 ROLES=Object.fromEntries(Object.entries(c.roles).map(([k,r])=>[k,{l:r.label,d:r.description,w:[r.weights.aim,r.weights.move,r.weights.sense,r.weights.mental]}]));
 ORIG=Object.fromEntries(Object.entries(c.origins).map(([k,o])=>[k,{l:o.label,d:o.summary,a:o.attributes,story:o.story}]));
 const sc=p=>c.scenarios.filter(s=>s.pool===p).map(s=>({id:s.id,t:s.title,x:s.text,o:s.options.map(o=>p==="clutch"?{t:o.label,s:o.stat,d:o.difficulty,b:o.impact,w:o.win,l:o.lose}:{t:o.label,e:o.effects})}));
 PREP=sc("prep");TRAIN=sc("train");OFF=sc("off");CLUTCH=sc("clutch");POOLS={prep:PREP,train:TRAIN,off:OFF,clutch:CLUTCH};
 RULES=c.rules;
}

/* ---------- Outils ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[ri(0,a.length-1)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fr=(x,d=0)=>Number(x).toFixed(d).replace(".",",");
const usd=x=>(x<0?"−":"")+Math.abs(Math.round(x)).toLocaleString("fr-FR").replace(/[  ]/g," ")+" $";
const ord=n=>n===1?"1er":n+"e";
let S=null, tab="carriere", screen="home", ui={confirm:null};

/* ---------- Monde ---------- */
const mkP=(n,r,f)=>({n,r,y:f?ri(0,2):ri(2,8),f:!!f,ks:0,kn:0});
function fakeName(){const used=new Set(allPlayers().map(p=>p.n));for(let i=0;i<40;i++){const n=pick(SYL1)+pick(SYL2);if(!used.has(n))return n}return pick(SYL1)+ri(10,99)}
function allPlayers(){if(!S||!S.teams)return[];return S.teams.flatMap(t=>t.p).concat(S.fa)}
function freshWorld(){
 S.teams=CDL0.map(([id,n,pr,p])=>({id,n,pr,lg:"CDL",p:p.map(([a,r])=>mkP(a,r)),pts:0,w:0,l:0}));
 S.fa=FA0.map(([a,r])=>mkP(a,r));
 S.teams.forEach(t=>{if(t.lg==="CDL"&&t.p.length<4)t.p.push(mkP(fakeName(),ri(70,73),true))});
 CH0.forEach(([id,n,pr])=>{const t={id,n,pr,lg:"CH",p:[],pts:0,w:0,l:0};S.teams.push(t);for(let i=0;i<4;i++)t.p.push(mkP(fakeName(),ri(62,72),true))});
}
const team=id=>S.teams.find(t=>t.id===id);
const myTeam=()=>team(S.teamId);
const league=lg=>S.teams.filter(t=>t.lg===lg);
const lgName=lg=>lg==="CDL"?"CDL":"Challengers";
const ovr=(m=S.me)=>{const w=ROLES[m.role].w,a=m.attrs;return a.aim*w[0]+a.move*w[1]+a.sense*w[2]+a.mental*w[3]};
const effR=()=>ovr()+S.me.form+(S.me.morale-50)/25;
function teamStr(t,live){
 const rs=t.p.map(p=>p.r);
 if(t.id===S.teamId){rs.push(live?effR():ovr());return rs.reduce((a,b)=>a+b,0)/rs.length+(live?(S.me.chem-50)/50+S.bonus:0)}
 return rs.reduce((a,b)=>a+b,0)/rs.length;
}
const rosterSorted=t=>{const l=t.p.map(p=>({n:p.n,r:p.r,f:p.f}));if(t.id===S.teamId)l.push({n:S.me.name,r:ovr(),me:true});return l.sort((a,b)=>b.r-a.r)};

/* ---------- Simulation ---------- */
function series(a,b,to,str){let x=0,y=0;const p=1/(1+Math.exp(-(str.get(a)-str.get(b))/RULES.simulation.mapSpread));while(x<to&&y<to){Math.random()<p?x++:y++}return{a,b,x,y,win:x>y?a:b,lose:x>y?b:a}}
function runEvent(lg,label,champs){
 let ts=league(lg);
 if(champs){ts=ts.slice().sort((a,b)=>b.pts-a.pts).slice(0,RULES.qualifiers[lg])}
 const str=new Map(ts.map(t=>[t.id,teamStr(t,true)+rnd(-RULES.simulation.tournamentNoise,RULES.simulation.tournamentNoise)]));
 const mine=[];const noteMine=(s,tag)=>{if(s.a===S.teamId||s.b===S.teamId){const me=s.a===S.teamId;mine.push({o:(me?s.b:s.a),w:me?s.x:s.y,l:me?s.y:s.x,tag})}};
 let qw=0,ql=0;
 if(!champs){for(let r=0;r<RULES.format.qualifierRounds;r++){const o=shuffle(ts);for(let i=0;i+1<o.length;i+=2){const s=series(o[i].id,o[i+1].id,RULES.format.seriesFirstTo,str);const W=team(s.win),L=team(s.lose);W.w++;L.l++;W.pts+=RULES.format.qualifierWinPoints;if(s.win===S.teamId)qw++;if(s.lose===S.teamId)ql++}}}

function worldRanking(){
 const score=(r,k,n,lg)=>r+(n?(k-1)*(lg==="CDL"?25:12):0);
 const list=S.teams.flatMap(t=>t.p.map(p=>({n:p.n,f:p.f,t:t.n,id:t.id,kd:p.kn?kd(p):null,s:score(p.r,kd(p),p.kn,t.lg)})));
 const mt=myTeam();
 list.push({n:S.me.name,t:mt.n,id:mt.id,me:true,kd:S.me.kn?kd(S.me):null,s:score(ovr(),kd(S.me),S.me.kn,mt.lg)});
 return list.sort((a,b)=>b.s-a.s);
}
const myRank=()=>worldRanking().findIndex(p=>p.me)+1;
function seasonRecord(evs){
 let w=0,l=0,ch=0,maj=0;
 (evs||[]).filter(e=>e.run).forEach(e=>{
  if(e.run.qual){const[a,b]=e.run.qual.split("-").map(Number);w+=a;l+=b}
  e.run.series.forEach(x=>{x.w>x.l?w++:l++});
  if(e.lg==="CDL"&&e.run.rank===1){if(e.champs)ch++;else maj++}
 });
 return{w,l,ch,maj};
}

}
function endView(){
 const m=S.me,wins=m.trophies.filter(t=>/^Champion Champs/.test(t.t)).length,maj=m.trophies.filter(t=>/^Vainqueur Major/.test(t.t)).length,mvp=m.trophies.filter(t=>/^MVP/.test(t.t)).length;
 const score=wins*30+maj*8+mvp*12+(m.best-60)*.8+m.career.length*1.5;
 const lab=score>=120?"Légende de la CDL":score>=70?"Grand nom de la ligue":score>=35?"Pro respecté":"Carrière honnête";
 return`<div class="stack"><div class="hero"><div class="lab">Fin de carrière · ${m.age} ans</div><h1 style="font-size:clamp(46px,10vw,96px)">${esc(m.name)}</h1><p><strong style="color:var(--accent)">${lab}</strong>. ${m.career.length} saison${m.career.length>1?"s":""}, ${usd(m.money)} gagnés (fictifs).</p></div>
 <div class="tiles"><div><b>${wins}</b><span class="lab">Titres Champs</span></div><div><b>${maj}</b><span class="lab">Majors</span></div><div><b>${mvp}</b><span class="lab">MVP</span></div><div><b>${Math.round(m.best)}</b><span class="lab">Meilleure note</span></div></div>
 <div class="scroll"><table><thead><tr><th>An</th><th>Équipe</th><th>Place</th><th>K/D</th><th>Note</th></tr></thead><tbody>${m.career.map(c=>`<tr><td>${c.y}</td><td>${esc(c.t)}</td><td>${ord(c.place)} ${lgName(c.lg)}</td><td>${fr(c.kd,2)}</td><td>${Math.round(c.ovr)}</td></tr>`).join("")}</tbody></table></div>
 <div class="row"><button class="btn" data-act="new" id="restart">Nouvelle carrière</button><button class="btn2" data-act="home" id="end-home">Retour à l'accueil</button></div></div>`;
}
function careerInfo(c){
 const m=c.me,t=c.teams.find(x=>x.id===c.teamId)||{n:"",id:c.teamId},tr=m.trophies.map(x=>x.t);
 return{id:c.id,name:m.name,nat:m.nat,team:t,year:c.endedYear||c.year,age:m.age,ovr:ovr(m),rank:c.rk,ended:!!c.ended,seasons:m.career.length,champs:tr.filter(x=>/^Champion Champs/.test(x)).length,majors:tr.filter(x=>/^Vainqueur Major/.test(x)).length,when:c.updated||c.ts||0};
}
function homeView(){
 const list=Object.values(STORE.careers).map(careerInfo).sort((a,b)=>(a.ended-b.ended)||(b.when-a.when)),cur=list.find(c=>!c.ended);
 const row=c=>`<section class="hcard ${cur&&c.id===cur.id?"lead":""}">
  ${tBand(c.team.id,esc(c.team.n||"Sans équipe"),Math.round(c.ovr))}
  <div class="hname"><strong>${flagOf(NAT_CODES[c.nat])}${esc(c.name)}</strong>${c.rank?` <span class="wrank">#${c.rank}</span>`:""}<span class="pill ${c.ended?"":"on"}">${c.ended?"Retraité":"En cours"}</span></div>
  <div class="dim" style="font-size:14px">${c.ended?"Fin en "+c.year:"Saison "+c.year} · ${c.age} ans · ${c.seasons} saison${c.seasons>1?"s":""} jouée${c.seasons>1?"s":""}</div>
  <div class="dim mono" style="font-size:13px">${c.champs} Champs · ${c.majors} Majors</div>
  <div class="row"><button class="${cur&&c.id===cur.id?"btn":"btn2"}" data-open="${c.id}" id="open-${c.id}">${c.ended?"Voir le bilan":"Continuer"}</button>
  ${ui.confirm==="del:"+c.id?`<span>Supprimer pour de bon ?</span><button class="btn2" data-del="${c.id}" id="del-yes-${c.id}">Oui</button><button class="btn2" data-act="cancel">Non</button>`:`<button class="ghost" data-askdel="${c.id}" id="del-${c.id}">Supprimer</button>`}</div>
 </section>`;
 return`<div class="hero"><h1>CDL Destiny</h1><p>${cur?"Ta carrière t'attend.":"Écris ta première carrière, du Challengers au titre mondial."}</p></div>
 <div class="row"><button class="${cur?"btn2":"btn"}" data-act="new" id="home-new">Nouvelle carrière</button></div>
 <section class="stack"><div class="lab">Mes carrières</div>${list.length?`<div class="grid">${list.map(row).join("")}</div>`:'<p class="dim">Aucune carrière pour l\'instant. Lance la première !</p>'}</section>
 <div><button class="ghost" data-tab="maj" id="home-maj">Mises à jour du jeu (révision ${CS.active.revision})</button></div>
 <p class="fine">Jeu de fan non officiel, sans lien avec Activision ni la Call of Duty League. Tes carrières restent sur ce téléphone.</p>`;
}
function randomTag(){
 const n={...DEFAULT_CONTENT.names,...CS.active.names},w=n.gamertagWords,used=new Set([...REAL_NAMES,...Object.values(STORE.careers).map(c=>c.me.name)]);
 for(let i=0;i<30;i++){const r=Math.random(),b=pick(w),t=r<.45?b:r<.7?pick(n.gamertagPrefixes)+b:r<.9?b+pick(n.gamertagSuffixes):b+pick(w);if(t.length<=18&&!used.has(t)&&t!==form.name)return t}
 return pick(w);
}
function createView(){
 const f=form,starters=STARTERS;if(!starters.some(s=>s[0]===f.team))f.team=starters[0][0];if(!ROLES[f.role])f.role=Object.keys(ROLES)[0];if(!ORIG[f.orig])f.orig=Object.keys(ORIG)[0];
 return`<div><button class="ghost" data-act="home" id="create-back">‹ Accueil</button></div><div class="hero"><h1>CDL Destiny</h1><p>Tu débutes en Challengers à 18 ans. Chaque saison tient en dix décisions maximum, et ton choix d'équipe dépend de ce que tu as montré. Jusqu'où tu montes ?</p></div>
 <form id="create" class="stack" autocomplete="off">
  <div class="two">
   <div class="field"><label class="lab" for="f-name">Ton pseudo</label><div class="tagrow"><input type="text" id="f-name" maxlength="18" value="${esc(f.name)}"><button type="button" class="btn2" data-act="reroll" id="f-reroll">Autre idée</button></div></div>
   <div class="field"><label class="lab" for="f-nat">Nationalité</label><select id="f-nat">${NATS.map(n=>`<option ${n===f.nat?"selected":""}>${n}</option>`).join("")}</select></div>
  </div>
  <div class="field"><div class="lab">Ton rôle</div><div class="pickrow">${Object.entries(ROLES).map(([k,r])=>`<button type="button" class="pick" data-role="${k}" aria-pressed="${f.role===k}"><strong>${r.l}</strong>${r.d}</button>`).join("")}</div></div>
  <div class="field"><div class="lab">D'où tu viens</div><div class="pickrow">${Object.entries(ORIG).map(([k,o])=>`<button type="button" class="pick" data-orig="${k}" aria-pressed="${f.orig===k}"><strong>${o.l}</strong>${o.d}</button>`).join("")}</div></div>
  <div class="field"><div class="lab">Ton équipe de Challengers</div><div class="pickrow">${starters.map(([id,n,d])=>`<button type="button" class="pick" data-team="${id}" aria-pressed="${f.team===id}"><strong>${n}</strong>${d}</button>`).join("")}</div></div>
  <div><button class="btn" type="submit" id="go">Commencer ma carrière</button></div>
 </form>
 <div><button class="ghost" data-tab="maj" id="to-maj">Mises à jour du jeu (révision ${CS.active.revision})</button></div>
 <p class="fine">Jeu de fan non officiel, sans lien avec Activision ni la Call of Duty League. Vrais noms d'équipes et de joueurs, effectifs de fin octobre 2026, notes estimées. Les équipes Challengers, leurs joueurs, les salaires et les primes sont fictifs.</p>`;
}
function render(){
 const app=document.getElementById("app");
 if(!S){app.innerHTML=tab==="maj"?updView():screen==="create"?createView():homeView();return}
 if(S.ended){app.innerHTML=endView();return}
 const body=tab==="palmares"?palmaresView():tab==="maj"?updView():tab==="equipes"?equipesView():tab==="matchs"?matchsView():tab==="classement"?classementView():carriereView();
 app.innerHTML=hud()+body;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 const d=b.dataset;
 if(d.tab){tab=d.tab;render();return}
 if(d.opt!==undefined){decide(+d.opt);return}
 if(d.sign){sign(d.sign);return}
 if(d.role||d.orig||d.team){form.name=document.getElementById("f-name").value;form.nat=document.getElementById("f-nat").value;if(d.role)form.role=d.role;if(d.orig)form.orig=d.orig;if(d.team)form.team=d.team;render();return}
 if(handleUpd(d,b))return;
 if(d.act==="reveal-ok"){S.reveal=null;S.ev=null;save();render();window.scrollTo&&window.scrollTo({top:0});return}
 if(d.act==="ask-retire"){ui.confirm="retire";render()}
  if(d.act==="cancel"){ui.confirm=null;render()}
 if(d.act==="retire"){ui.confirm=null;retire()}
 if(d.act==="home"){ui.confirm=null;closeCareer();tab="carriere";screen="home";keepPending();render();window.scrollTo&&window.scrollTo({top:0})}
 if(d.act==="reroll"){keepForm();form.name=randomTag();render();const n=document.getElementById("f-name");return}
 if(d.act==="new"){ui.confirm=null;closeCareer();tab="carriere";screen="create";keepPending();form.name=randomTag();render();window.scrollTo&&window.scrollTo({top:0})}
 if(d.open){const c=STORE.careers[d.open];if(c){ui.confirm=null;S=c;tab="carriere";STORE.currentId=c.id;render();window.scrollTo&&window.scrollTo({top:0})}return}
 if(d.askdel){ui.confirm="del:"+d.askdel;render();return}
 if(d.del){delete STORE.careers[d.del];ui.confirm=null;saveStore();render();return}
});
document.addEventListener("submit",e=>{if(e.target.id!=="create")return;e.preventDefault();form.name=document.getElementById("f-name").value;form.nat=document.getElementById("f-nat").value;startCareer(form)});

boot();
</script>
