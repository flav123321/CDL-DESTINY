/* Concept : la régie d'une organisation esport. Bandeau de l'équipe en haut, piste de saison, puis le travail de la semaine. Thème sombre unique, assumé. */
:root{
  color-scheme:dark;
  --bg:#0c1417; --panel:#132026; --panel2:#1a2a31; --line:#2a3d45; --line2:#36505a;
  --fg:#eaf0f1; --dim:#8fa3aa; --accent:#f5a524; --accent-ink:#1b1204;
  --win:#55d394; --loss:#ff7a6b; --warn:#f5c451;
  --team:#f5a524;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
#app{max-width:1160px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.dim{color:var(--dim)}
.win{color:var(--win)} .loss{color:var(--loss)} .warn{color:var(--warn)}
.flag{font-style:normal;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;margin-right:4px}

/* Boutons */

}

    const tac = [a === S.userTeam ? (userTac || S.tactic) : aiTactic(S, a), b === S.userTeam ? (userTac || S.tactic) : aiTactic(S, b)];
    recordMap(S, ser, runMap(createMapSim(S, m.mode, m.map, [a, b], tac)));
  }

}
function applySeries(S, ser) {
  // Statistiques, forme, moral et fatigue après une série.
  for (const pid in ser.stats) {
    const p = S.players[pid]; if (!p) continue;
    const st = ser.stats[pid];
    p.ss.k += st.k; p.ss.d += st.d; p.ss.maps += st.maps;
    p.car.k += st.k; p.car.d += st.d; p.car.maps += st.maps;
    const kd = st.k / Math.max(1, st.d);
    p.form = clamp(Math.round((p.form * .7 + (kd - 1) * 4) * 10) / 10, -6, 6);
  }
  const best = Object.entries(ser.stats).sort((x, y) => (y[1].k - y[1].d) - (x[1].k - x[1].d))[0];
  if (best && S.players[best[0]]) { S.players[best[0]].ss.mvp++; ser.mvp = best[0]; }
  for (const tid of [ser.a, ser.b]) {
    const won = ser.winner === tid;
    for (const p of starters(S, tid)) {
      p.morale = clamp(p.morale + (won ? 3 : -3), 5, 100);
      p.fatigue = clamp(p.fatigue + 5 + (S.tactic === "agressif" && tid === S.userTeam ? 2 : 0), 0, 100);
    }
    S.teams[tid].chem = clamp(S.teams[tid].chem + (won ? 1 : -.5), 20, 100);

}
function userPair(S) {
  const st = S.schedule[S.step]; if (!st) return null;
  if (st.type === "qual") {
    const p = st.pairs.find(x => x.includes(S.userTeam));
    return p ? { a: p[0], b: p[1], firstTo: DATA.rules.format.seriesFirstTo, label: `Major ${st.major + 1} · Qualifs, journée ${st.round + 1}` } : null;
  }
  if (S.bracket && !S.bracket.done) {
    const B = S.bracket, round = B.rounds[B.stage];
    const p = round.find(x => x.includes(S.userTeam));
    if (!p) return null;
    return { a: p[0], b: p[1], firstTo: B.firstTo[B.stage], label: `${B.name} · ${B.stageNames[B.stage]}` };
  }
  return null;
}

/* ---------- Avancer d'une étape ---------- */
// userSeries : résultat d'une série jouée en direct (optionnel). Retourne un résumé.
function advance(S, userSeries) {
  if (S.over) return null;
  if (S.phase === "offseason") return null;
  const st = S.schedule[S.step];
  const out = { label: "", user: null, others: [] };
  if (st.type === "qual") {
    out.label = `Major ${st.major + 1} · Qualifs, journée ${st.round + 1}`;
    for (const [a, b] of st.pairs) {
      let ser;
      if ((a === S.userTeam || b === S.userTeam) && userSeries) ser = userSeries;
      else ser = simSeries(S, a, b, DATA.rules.format.seriesFirstTo, out.label);
      applySeries(S, ser);
      const w = ser.winner, l = w === a ? b : a;
      const md = Math.abs(ser.wins[0] - ser.wins[1]);
      S.qual[w].w++; S.qual[w].md += md; S.qual[l].l++; S.qual[l].md -= md;
      const res = { label: out.label, a, b, wins: ser.wins.slice(), winner: w, maps: ser.maps, mvp: ser.mvp, stats: ser.stats };
      S.results.push(res);
      if (a === S.userTeam || b === S.userTeam) out.user = res; else out.others.push(res);
    }
    weekly(S, out);
    S.step++;
    if (S.schedule[S.step] && S.schedule[S.step].type === "major") openBracket(S, S.schedule[S.step]);
    return out;
  }
  // Tournoi (Major ou Champs) : un tour à la fois
  const B = S.bracket;
  out.label = `${B.name} · ${B.stageNames[B.stage]}`;
  const round = B.rounds[B.stage];
  const winners = [];
  for (const [a, b] of round) {
    let ser;
    if ((a === S.userTeam || b === S.userTeam) && userSeries) ser = userSeries;
    else ser = simSeries(S, a, b, B.firstTo[B.stage], out.label);
    applySeries(S, ser);
    winners.push(ser.winner);
    const loser = ser.winner === a ? b : a;
    B.out.push({ id: loser, stage: B.stage });
    const res = { label: out.label, a, b, wins: ser.wins.slice(), winner: ser.winner, maps: ser.maps, mvp: ser.mvp, stats: ser.stats };
    B.results[B.stage].push(res);
    S.results.push(res);
    if (a === S.userTeam || b === S.userTeam) out.user = res; else out.others.push(res);
  }
  B.stage++;
  if (winners.length > 1) {
    const nx = []; for (let i = 0; i < winners.length; i += 2) nx.push([winners[i], winners[i + 1]]);
    B.rounds.push(nx);
  } else {
    B.champion = winners[0]; B.done = true;
    closeBracket(S, B, out);
    weekly(S, out);
    S.step++;
    if (S.step >= S.schedule.length) endSeason(S, out);
    else if (S.schedule[S.step].type === "champs") openBracket(S, S.schedule[S.step]);
    else resetQual(S);
  }
  return out;
}
function openBracket(S, st) {
  const isChamps = st.type === "champs";
  let seeds;
  if (isChamps) seeds = S.order.slice().sort((a, b) => S.points[b] - S.points[a] || teamRating(S, b) - teamRating(S, a)).slice(0, 8);
  else seeds = qualTable(S).slice(0, 8).map(r => r.id);
  const f = DATA.rules.format;
  const B = {
    name: isChamps ? "CDL Champs" : `Major ${st.major + 1}`, champs: isChamps, major: st.major,
    seeds, stage: 0, rounds: [[[seeds[0], seeds[7]], [seeds[3], seeds[4]], [seeds[1], seeds[6]], [seeds[2], seeds[5]]]],
    stageNames: ["Quarts de finale", "Demi-finales", "Finale"],
    firstTo: [f.seriesFirstTo, f.seriesFirstTo, isChamps ? f.champsFinalFirstTo : f.majorFinalFirstTo],
    results: [[], [], []], out: [], done: false, champion: null,
    elim: isChamps ? [] : qualTable(S).slice(8).map(r => r.id),
  };
  S.bracket = B;
  const inIt = seeds.includes(S.userTeam);
  addNews(S, inIt ? `${B.name} : ton équipe est qualifiée, tête de série n°${seeds.indexOf(S.userTeam) + 1}.` : `${B.name} : ton équipe n'est pas qualifiée pour le tournoi.`, inIt ? "good" : "bad");
}
function placements(B) {
  // Classement final 1..8 à partir des éliminations, départage par la tête de série.
  const seedIdx = id => B.seeds.indexOf(id);
  const by = s => B.out.filter(o => o.stage === s).map(o => o.id).sort((a, b) => seedIdx(a) - seedIdx(b));
  const final = B.out.find(o => o.stage === 2);
  return [B.champion, final && final.id, ...by(1), ...by(0)];
}
function closeBracket(S, B, out) {
  const place = placements(B);
  const rules = DATA.rules;
  const prizes = B.champs ? rules.prizes.champs : rules.prizes.major;
  const all = B.champs ? place : place.concat(B.elim);
  const summary = [];
  all.forEach((id, i) => {
    if (!B.champs) S.points[id] += rules.points.CDL[i] || 0;
    const prize = prizes[i] || 0;
    S.teams[id].cash += prize;
    if (id === S.userTeam) {
      if (prize) money(S, prize, `${B.name} : ${i + 1}e place`);
      if (i === 0) { S.titles.push(`${B.name} ${S.season}`); for (const p of starters(S, id)) p.car.titles++; }
      if (i === 0 && !B.champs) S.majorWins++;
      sponsorBonus(S, i, B.champs);
      out.userPlace = i + 1;
    }
    summary.push(id);
  });
  if (!B.champs) S.majors.push({ name: B.name, champion: B.champion, place: all });
  else S.champsResult = { champion: B.champion, place: all };
  const ut = S.userTeam, up = all.indexOf(ut);
  addNews(S, `${S.teams[B.champion].name} remporte ${B.name === "CDL Champs" ? "les CDL Champs" : "le " + B.name} !` + (up >= 0 ? ` Ton équipe termine ${up + 1}e.` : ""), B.champion === ut ? "good" : "info");
  for (const id of S.order) {
    const pl = all.indexOf(id);
    const t = S.teams[id];
    if (pl === 0) t.prestige = clamp(t.prestige + 2, 20, 100);
    if (pl >= 8) t.prestige = clamp(t.prestige - .5, 20, 100);
  }
}
function qualTable(S) {
  return S.order.map(id => ({ id, ...S.qual[id] }))
    .sort((a, b) => b.w - a.w || b.md - a.md || S.points[b.id] - S.points[a.id] || teamRating(S, b.id) - teamRating(S, a.id));
}
function pointsTable(S) {
  return S.order.map(id => ({ id, pts: S.points[id] })).sort((a, b) => b.pts - a.pts || teamRating(S, b.id) - teamRating(S, a.id));
}

/* ---------- Semaine : finances, entraînement, événements ---------- */
function money(S, amount, why) {
  S.finances.cash += amount;
  S.finances.log.unshift({ s: S.season, w: S.week, amount: Math.round(amount), why });
  if (S.finances.log.length > 80) S.finances.log.length = 80;
}
function payroll(S, tid) { return S.teams[tid].roster.reduce((s, id) => s + (S.players[id] ? S.players[id].salary : 0), 0); }
function weeklyIncome(S) {
  const t = S.teams[S.userTeam];
  const sp = S.finances.sponsor ? S.finances.sponsor.perWeek : 0;
  const merch = Math.round(t.prestige * 140 + S.majorWins * 1500);
  return { sponsor: sp, merch, salaries: Math.round(payroll(S, S.userTeam) / WEEKS_PER_SEASON), ops: 9000 };
}
function weekly(S, out) {
  S.week++;
  const inc = weeklyIncome(S);
  money(S, inc.sponsor, "Sponsor principal");
  money(S, inc.merch, "Boutique et billetterie");
  money(S, -inc.salaries, "Salaires des joueurs");
  money(S, -inc.ops, "Staff, bootcamp et déplacements");
  const tr = TRAINING[S.training];
  const ut = S.teams[S.userTeam];
  ut.chem = clamp(ut.chem + tr.chem, 20, 100);
  ut.roster.forEach((id, i) => {
    const p = S.players[id]; if (!p) return;
    const bench = i >= 4;
    p.fatigue = clamp(p.fatigue + (bench ? -8 : tr.fat - 7), 0, 100);
    p.morale = clamp(p.morale + tr.morale + (bench ? -2.5 : 0) + (p.morale < 50 ? .8 : -.6), 5, 100);
    if (S.training === "repos") p.form = clamp(p.form + .6, -6, 6);
    growPlayer(p, S.training, 1);
  });
  // Les équipes IA : récupération et progression moyenne
  for (const id of S.order.concat(S.chOrder)) {
    if (id === S.userTeam) continue;
    for (const pid of S.teams[id].roster) {
      const p = S.players[pid]; if (!p) continue;
      p.fatigue = clamp(p.fatigue - 3, 0, 100);
      p.morale = clamp(p.morale + (p.morale < 60 ? 1 : -.5), 5, 100);
      growPlayer(p, pick(["aim", "strat", "cohesion"]), .85);
    }
  }
  for (const p of Object.values(S.players)) if (!p.teamId) growPlayer(p, "strat", .5);
  maybeEvent(S);
  if (S.finances.cash < 0 && S.week % 3 === 0) addNews(S, `Trésorerie négative : ${fmtMoney(S.finances.cash)}. Le conseil s'inquiète.`, "bad"), S.board = clamp(S.board - 4, 0, 100);
}
function growPlayer(p, focus, scale) {
  const gap = p.pot - ovr(p);
  if (gap <= 0) return;
  const ageF = p.age <= 20 ? 1.3 : p.age <= 23 ? 1 : p.age <= 26 ? .55 : .2;
  const base = .055 * ageF * scale * Math.min(1, gap / 4);
  const boost = { aim: ["aim", "move"], strat: ["sense", "mental"], cohesion: ["mental"], repos: [] }[focus] || [];
  for (const k of ["aim", "move", "sense", "mental"]) {
    const g = base * (boost.includes(k) ? 2.1 : focus === "repos" ? 0 : .5) * rnd(.3, 1.7);
    p[k] = clamp(round1(p[k] + g), 40, 99);
  }
}

}

function maybeEvent(S) {

  if (ps.length < 2) return;
  S.recentEv = S.recentEv || [];
  const pool = EVENTS.filter(x => !S.recentEv.includes(x.title));
  const e = pick(pool.length ? pool : EVENTS);
  S.recentEv.push(e.title); if (S.recentEv.length > 7) S.recentEv.shift();
  const p = pick(ps), q = pick(ps.filter(x => x !== p));
  const sub = s => s.replace(/\{p\}/g, p.name).replace(/\{q\}/g, q.name);
  pushInbox(S, {
    from: "Vie de l'équipe", title: sub(e.title), text: sub(e.text), kind: "event", read: false, need: true,
    options: e.opts.map((o, i) => ({ id: "o" + i, label: sub(o.label), fx: o.fx, p: p.id, q: q.id })),
  });
}
function answer(S, msgId, optId) {

  const o = m.options.find(x => x.id === optId); if (!o) return null;

  const ps = ut.roster.map(id => S.players[id]).filter(Boolean);
  let txt = "";
  if (o.sponsor) {
    S.finances.sponsor = o.sponsor;
    txt = `${o.sponsor.name} devient sponsor principal.`;
    addNews(S, txt, "good");
    return txt;
  }
  const fx = o.fx || {}; const P = S.players[o.p], Q = S.players[o.q];
  const parts = [];
  if (fx.cash) { money(S, fx.cash, m.title); parts.push(`${fx.cash > 0 ? "+" : ""}${fmtMoney(fx.cash)}`); }
  if (fx.chem) { ut.chem = clamp(ut.chem + fx.chem, 20, 100); parts.push(`cohésion ${fx.chem > 0 ? "+" : ""}${fx.chem}`); }
  if (fx.morale) { ps.forEach(p => p.morale = clamp(p.morale + fx.morale, 5, 100)); parts.push(`moral équipe ${fx.morale > 0 ? "+" : ""}${fx.morale}`); }
  if (fx.fatigue) { ps.forEach(p => p.fatigue = clamp(p.fatigue + fx.fatigue, 0, 100)); parts.push(`fatigue ${fx.fatigue > 0 ? "+" : ""}${fx.fatigue}`); }
  if (fx.form) { ps.forEach(p => p.form = clamp(p.form + fx.form, -6, 6)); parts.push(`forme ${fx.form > 0 ? "+" : ""}${fx.form}`); }
  if (fx.mental) { ps.forEach(p => p.mental = clamp(round1(p.mental + fx.mental), 40, 99)); parts.push(`mental +${fx.mental}`); }
  if (fx.grow) { ps.forEach(p => { for (let i = 0; i < 4; i++) growPlayer(p, "strat", fx.grow); }); parts.push("progression"); }
  if (fx.prestige) { ut.prestige = clamp(ut.prestige + fx.prestige, 20, 100); parts.push(`prestige +${fx.prestige}`); }
  if (P) {
    if (fx.pMorale) { P.morale = clamp(P.morale + fx.pMorale, 5, 100); parts.push(`moral ${P.name} ${fx.pMorale > 0 ? "+" : ""}${fx.pMorale}`); }
    if (fx.pFatigue) { P.fatigue = clamp(P.fatigue + fx.pFatigue, 0, 100); parts.push(`fatigue ${P.name} ${fx.pFatigue > 0 ? "+" : ""}${fx.pFatigue}`); }
    if (fx.pForm) { P.form = clamp(P.form + fx.pForm, -6, 6); parts.push(`forme ${P.name} ${fx.pForm}`); }
    if (fx.extend) { const r = negotiate(S, P.id, Math.round(P.salary * 1.15 / 1000) * 1000, 2); parts.push(r.ok ? `${P.name} prolonge de 2 saisons` : `${P.name} refuse : ${r.why}`); }
  }
  if (Q && fx.qMorale) { Q.morale = clamp(Q.morale + fx.qMorale, 5, 100); parts.push(`moral ${Q.name} ${fx.qMorale}`); }

    if (!m) return "o";
    const pl = m.place.indexOf(S.userTeam);
    return pl === 0 ? "gold" : pl >= 0 && pl < 4 ? "w" : "o";
  };
  return `<div class="track" aria-label="Progression de la saison">${legs.map(L => `<div class="leg"><span class="lab">${L.name}</span><div class="ticks">${L.steps.map(x => `<span class="tk ${cls(x)}" title="${x.s.type === "qual" ? "Qualifs J" + (x.s.round + 1) : "Tournoi"}"></span>`).join("")}</div></div>`).join("")}</div>`;
}

/* ---------- QG ---------- */
function vAccueil() {
  const out = [];
  if (S.over) out.push(`<section class="panel"><h2>Fin de l'aventure</h2><p>Le conseil t'a licencié après la saison ${S.season}. Ton palmarès : ${S.titles.length ? S.titles.map(esc).join(", ") : "aucun titre"}.</p><div><button class="btn" data-act="newgame">Nouvelle partie</button></div></section>`);
  if (ui.flash) out.push(vFlash(ui.flash));
  if (!S.over) out.push(S.phase === "offseason" ? vOffseason() : vFixture());
  if (!S.over && S.phase === "season") out.push(vWeekPlan());
  out.push(vInbox());
  return `<div class="cols"><div class="stack">${out.join("")}</div><aside class="stack">${vSideTable()}${vNews()}</aside></div>`;
}
function vFixture() {
  const pair = E.userPair(S);
  const pend = E.pendingChoices(S);
  const warn = E.roleCheck(S, S.userTeam);
  const blocked = pend.length > 0 || ut().roster.length < 4;
  const notes = [];
  if (pend.length) notes.push(`<div class="alert">Réponds ${pend.length > 1 ? "aux " + pend.length + " messages" : "au message"} en attente avant de jouer.</div>`);
  if (ut().roster.length < 4) notes.push(`<div class="alert bad">Il te faut au moins 4 joueurs. Recrute sur le marché.</div>`);
  else if (warn.length) notes.push(`<div class="alert">${warn.map(esc).join(" ")}</div>`);
  if (!pair) {
    return `<section class="panel"><span class="lab">${esc(stepLabel())}</span><h2>Ton équipe ne joue pas ce tour</h2><p class="note">${S.bracket && S.bracket.seeds.includes(S.userTeam) ? "Elle est éliminée de ce tournoi." : "Elle n'est pas qualifiée pour ce tournoi."} Tu peux simuler la suite du tournoi.</p>${notes.join("")}<div class="rowx"><button class="btn" data-act="sim" ${pend.length ? "disabled" : ""}>Simuler le tour</button></div></section>`;
  }
  const [ca, cb] = sideColors(pair.a, pair.b);
  const ra = E.teamRating(S, pair.a), rb = E.teamRating(S, pair.b);
  const side = (id, r, right) => `<div class="side ${right ? "r" : ""}">${crest(id)}<h2>${esc(T(id).name)}</h2><span class="note">Force</span><span class="force">${fmt1(r)}</span><span class="note">${E.starters(S, id).map(p => esc(p.name)).join(" · ")}</span></div>`;
  const bo = pair.firstTo * 2 - 1;
  return `<section class="fixture" style="--ca:${ca};--cb:${cb}">
    <div class="rowx"><span class="lab">Prochain match · ${esc(pair.label)}</span><span class="spacer"></span><span class="lab">Bo${bo} · premier à ${pair.firstTo}</span></div>
    <div class="vs">${side(pair.a, ra)}<span class="x">VS</span>${side(pair.b, rb, true)}</div>
    ${notes.join("")}
    <div class="rowx"><button class="btn" data-act="live" ${blocked ? "disabled" : ""}>Jouer en direct</button><button class="btn ghost" data-act="sim" ${blocked ? "disabled" : ""}>Simuler la série</button></div>
  </section>`;
}
function vFlash(o) {
  if (o.seasonEnd) {
    const h = o.seasonEnd;
    return `<section class="result"><span class="lab">Saison ${h.season} terminée</span><h2>${h.rank}e au classement CDL</h2><p>${h.ok ? '<span class="win">Objectif atteint.</span>' : '<span class="loss">Objectif manqué.</span>'} ${esc(h.objective)}</p>${h.mvp ? `<p class="note">Meilleur K/D de la saison : ${esc(h.mvp.name)} (${h.mvp.kd.toFixed ? h.mvp.kd.toFixed(2) : h.mvp.kd}).</p>` : ""}<div><button class="link" data-act="dismiss">Fermer</button></div></section>`;
  }
  const r = o.user;
  const others = (o.others || []).slice(0, 8);
  let html = "";
  if (r) {
    const me = r.a === S.userTeam ? 0 : 1, won = r.winner === S.userTeam;
    const opp = me === 0 ? r.b : r.a;
    const mv = r.mvp && P(r.mvp);
    html = `<span class="lab">${esc(r.label)}</span>
      <div class="rowx"><span class="bigscore ${won ? "win" : "loss"}">${r.wins[me]}-${r.wins[1 - me]}</span><div><h2>${won ? "Victoire" : "Défaite"} contre ${esc(T(opp).name)}</h2>${mv ? `<span class="note">MVP : ${esc(mv.name)} (${T(mv.teamId) ? esc(T(mv.teamId).tag) : ""}) · ${r.stats[r.mvp].k}/${r.stats[r.mvp].d}</span>` : ""}</div></div>
      <div class="maps">${r.maps.map(m => { const w = (m.winner === me); return `<div class="mapc ${w ? "w" : "l"}"><span class="lab">${E.MODES[m.mode]}</span><b>${m.score[me]}-${m.score[1 - me]}</b><span>${esc(m.map)}</span></div>`; }).join("")}</div>
      ${vMyStats(r)}`;
  } else html = `<span class="lab">${esc(o.label)}</span><h2>Tour simulé</h2>`;
  if (o.userPlace) html += `<div class="alert ${o.userPlace === 1 ? "good" : ""}">Tournoi terminé : ton équipe finit ${o.userPlace === 1 ? "championne !" : o.userPlace + "e."}</div>`;
  if (others.length) html += `<details><summary class="lab" style="cursor:pointer">Autres résultats (${o.others.length})</summary><ul class="news">${others.map(x => `<li><span class="mono">${x.wins[0]}-${x.wins[1]}</span><span>${x.winner === x.a ? "<b>" + esc(T(x.a).tag) + "</b> bat " + esc(T(x.b).tag) : "<b>" + esc(T(x.b).tag) + "</b> bat " + esc(T(x.a).tag)}</span></li>`).join("")}</ul></details>`;
  return `<section class="result">${html}<div><button class="link" data-act="dismiss">Fermer</button></div></section>`;
}
function vMyStats(r) {
  const mine = Object.entries(r.stats).filter(([id]) => P(id) && P(id).teamId === S.userTeam).sort((a, b) => b[1].k - a[1].k);
  if (!mine.length) return "";
  return `<div class="tw"><table><thead><tr><th>Joueur</th><th class="n">K</th><th class="n">D</th><th class="n">K/D</th></tr></thead><tbody>${mine.map(([id, s]) => `<tr><td>${esc(P(id).name)}</td><td class="n">${s.k}</td><td class="n">${s.d}</td><td class="n ${s.k >= s.d ? "win" : "loss"}">${kd(s.k, s.d)}</td></tr>`).join("")}</tbody></table></div>`;
}
function vWeekPlan() {
  return `<section class="sec"><h2>Plan de la semaine</h2>
    <div class="panel">
      <span class="lab">Entraînement</span>
      <div class="chips">${Object.entries(E.TRAINING).map(([k, v]) => `<button class="chip" data-act="train" data-v="${k}" aria-pressed="${S.training === k}">${v.label}</button>`).join("")}</div>
      <p class="note">${esc(E.TRAINING[S.training].desc)}</p>
      <span class="lab">Tactique de base en match</span>
      <div class="chips">${Object.entries(E.TACTICS).map(([k, v]) => `<button class="chip" data-act="tac" data-v="${k}" aria-pressed="${S.tactic === k}">${v.label}</button>`).join("")}</div>
      <p class="note">${{ agressif: "Fort en attaque : prise de colline, entrée sur les sites. Plus de duels, plus de fatigue.", equilibre: "Aucun point faible marqué.", prudent: "Fort en défense : tenir une colline, défendre un site. Moins de duels." }[S.tactic]}</p>
    </div></section>`;
}
function vInbox() {
  const list = S.inbox.slice(0, 8);
  if (!list.length) return "";
  const pend = list.filter(m => m.need && !m.answered), rest = list.filter(m => !(m.need && !m.answered));
  return `<section class="sec"><h2>Messages</h2>${pend.concat(rest).map(m => `<article class="msg ${m.need && !m.answered ? "need" : ""}">
    <span class="lab">${esc(m.from)} · S${m.s} sem. ${m.w}</span><h3>${esc(m.title)}</h3><p>${esc(m.text)}</p>
    ${m.options && !m.answered ? `<div class="opts">${m.options.map(o => `<button class="opt" data-act="ans" data-m="${m.id}" data-o="${o.id}"><span>${esc(o.label)}</span>${o.detail ? `<small>${esc(o.detail)}</small>` : ""}</button>`).join("")}</div>` : ""}
    ${m.answered && m.options ? `<p class="res">Choix : ${esc(m.options.find(o => o.id === m.answered).label)}${m.result ? " · " + esc(m.result) : ""}</p>` : ""}
  </article>`).join("")}</section>`;
}
function vNews() {
  return `<section class="sec"><h3>Actu de la ligue</h3><ul class="news">${S.news.slice(0, 12).map(n => `<li class="${n.kind}"><span class="lab">Sem.&nbsp;${n.w}</span><span>${esc(n.text)}</span></li>`).join("")}</ul></section>`;
}
function vSideTable() {
  const st = S.schedule[S.step];
  if (S.phase === "season" && st && st.type === "qual") {
    const t = E.qualTable(S);
    return `<section class="sec"><h3>Qualifs du Major ${st.major + 1}</h3><p class="note">Les 8 premiers jouent le tournoi.</p><div class="tw"><table><thead><tr><th>#</th><th>Équipe</th><th class="n">V-D</th><th class="n">Maps</th></tr></thead><tbody>${t.map((r, i) => `<tr class="${r.id === S.userTeam ? "me" : ""} ${i === 7 ? "cut" : ""}"><td class="mono">${i + 1}</td><td>${crest(r.id, "sm")} ${esc(T(r.id).tag)}</td><td class="n">${r.w}-${r.l}</td><td class="n">${r.md > 0 ? "+" : ""}${r.md}</td></tr>`).join("")}</tbody></table></div></section>`;
  }
  return vPointsTable(true);
}
function vPointsTable(small) {
  const t = E.pointsTable(S);
  return `<section class="sec"><h3>Classement CDL</h3>${small ? '<p class="note">Les 8 premiers vont aux Champs.</p>' : ""}<div class="tw"><table><thead><tr><th>#</th><th>Équipe</th><th class="n">Pts</th>${small ? "" : '<th class="n">Force</th>'}</tr></thead><tbody>${t.map((r, i) => `<tr class="${r.id === S.userTeam ? "me" : ""} ${i === 7 ? "cut" : ""}"><td class="mono">${i + 1}</td><td>${crest(r.id, "sm")} ${esc(small ? T(r.id).tag : T(r.id).name)}</td><td class="n">${r.pts}</td>${small ? "" : `<td class="n">${fmt1(E.teamRating(S, r.id))}</td>`}</tr>`).join("")}</tbody></table></div></section>`;
}
function vOffseason() {
  const t = ut();
  const exp = t.roster.map(P).filter(p => p.expiring);
  const ret = t.roster.map(P).filter(p => p.retireNext);
  const h = S.history[S.history.length - 1];
  return `<section class="panel"><span class="lab">Intersaison</span><h2>Prépare la saison ${S.season + 1}</h2>
    <p>Classement final ${h ? h.rank + "e" : ""}. Le marché est ouvert : prolonge tes joueurs, recrute des agents libres et des jeunes des Challengers.</p>
    ${exp.length ? `<div class="alert">Fin de contrat : ${exp.map(p => esc(p.name)).join(", ")}. Va dans Effectif pour les prolonger, sinon ils partent au lancement de la saison.</div>` : ""}
    ${ret.length ? `<div class="alert bad">Retraite annoncée : ${ret.map(p => esc(p.name)).join(", ")}. Trouve un remplaçant.</div>` : ""}
    <div class="rowx"><button class="btn" data-act="nextseason">Lancer la saison ${S.season + 1}</button><button class="btn ghost" data-act="tab" data-v="marche">Ouvrir le marché</button></div>
  </section>`;
}

/* ---------- Effectif ---------- */
function bars(p) {
  const b = (k, l) => `<div class="bar"><span>${l}<b>${Math.round(p[k])}</b></span><i style="--v:${Math.max(0, (p[k] - 50) * 2)}%"></i></div>`;
  return `<div class="bars">${b("aim", "Aim")}${b("move", "Mouv.")}${b("sense", "Lecture")}${b("mental", "Mental")}</div>`;
}
function cond(p) {
  const c = (v, good, bad) => v >= good ? "var(--win)" : v <= bad ? "var(--loss)" : "var(--warn)";
  return `<span class="st3" style="--c:${c(p.form, 1, -1.5)}"><i></i>Forme ${p.form > 0 ? "+" : ""}${fmt1(p.form)}</span>
    <span class="st3" style="--c:${c(p.morale, 65, 40)}"><i></i>Moral ${Math.round(p.morale)}</span>
    <span class="st3" style="--c:${c(100 - p.fatigue, 70, 45)}"><i></i>Fatigue ${Math.round(p.fatigue)}</span>`;
}
function vEffectif() {
  const t = ut();
  const ps = t.roster.map(P);
  const warn = E.roleCheck(S, t.id);
  const pay = E.payroll(S, t.id);
  const card = (p, i) => `<article class="pcard ${i < 4 ? "st" : ""}">
    <div class="ov">${E.pOvr(p)}<small>${p.role}</small></div>
    <div style="min-width:0"><div class="nm">${fl(p.nat)}${esc(p.name)}</div>
      <div class="meta">${i < 4 ? "Titulaire" : "Remplaçant"} · ${p.age} ans · pot. ${potLabel(p)} · ${M(p.salary)}/an · ${p.expiring ? '<span class="warn">fin de contrat</span>' : p.years + " saison" + (p.years > 1 ? "s" : "")}</div></div>
    <div class="acts">
      <select class="sel" data-act="role" data-id="${p.id}" aria-label="Rôle de ${esc(p.name)}">${E.ROLES.map(r => `<option ${r === p.role ? "selected" : ""}>${r}</option>`).join("")}</select>
      <select class="sel" data-act="slot" data-id="${p.id}" aria-label="Poste de ${esc(p.name)}">${ps.map((_, j) => `<option value="${j}" ${j === i ? "selected" : ""}>${j < 4 ? "Titulaire " + (j + 1) : "Remplaçant " + (j - 3)}</option>`).join("")}</select>
    </div>
    <div class="more">${bars(p)}<div class="rowx">${cond(p)}<span class="st3">K/D saison ${kd(p.ss.k, p.ss.d)}</span><button class="link" data-act="player" data-id="${p.id}">Contrat et détails</button></div></div>
  </article>`;
  return `<div class="cols"><div class="stack">
    <section class="sec"><h2>Effectif</h2><p class="note">4 titulaires, 2 remplaçants maximum. Les remplaçants récupèrent mais perdent du moral. Change le rôle d'un joueur si ta compo manque d'AR ou de SMG.</p>
    ${warn.length ? `<div class="alert">${warn.map(esc).join(" ")}</div>` : ""}
    <div class="plist">${ps.map(card).join("") || '<p class="note">Aucun joueur. Va sur le marché.</p>'}</div></section>
  </div><aside class="stack">
    <section class="panel"><span class="lab">Force d'équipe</span><b class="force">${fmt1(E.teamRating(S, t.id))}</b>
      <span class="lab">Cohésion</span><div class="bar"><span>Ensemble depuis des semaines<b>${Math.round(t.chem)}</b></span><i style="--v:${t.chem}%"></i></div>
      <span class="lab">Masse salariale</span><b class="mono">${M(pay)}/an</b>
      <p class="note">Une nouvelle recrue fait baisser la cohésion. L'entraînement Cohésion la fait remonter.</p></section>
    ${vPointsTable(true)}
  </aside></div>`;
}

/* ---------- Marché ---------- */
function vMarche() {
  const list = E.marketList(S, ui.mk).filter(p => ui.mkRole === "all" || p.role === ui.mkRole).slice(0, 40);
  const t = ut();
  return `<section class="sec"><h2>Marché des transferts</h2>
    <p class="note">${S.phase === "offseason" ? "Intersaison : c'est le meilleur moment pour recruter." : "Le marché reste ouvert pendant la saison."} Effectif : ${t.roster.length}/6. Trésorerie : ${M(S.finances.cash)}.</p>
    <div class="chips">${[["fa", "Agents libres"], ["ch", "Challengers"], ["cdl", "Équipes CDL"]].map(([k, v]) => `<button class="chip" data-act="mk" data-v="${k}" aria-pressed="${ui.mk === k}">${v}</button>`).join("")}</div>
    <div class="chips">${[["all", "Tous les rôles"], ["SMG", "SMG"], ["AR", "AR"], ["Flex", "Flex"]].map(([k, v]) => `<button class="chip" data-act="mkrole" data-v="${k}" aria-pressed="${ui.mkRole === k}">${v}</button>`).join("")}</div>
    <div class="plist">${list.map(p => {
      const fee = E.askingFee(S, p);
      return `<button class="mrow" data-act="player" data-id="${p.id}">
        <span class="ov">${E.pOvr(p)}</span>
        <span style="min-width:0"><span class="nm">${fl(p.nat)}${esc(p.name)}</span><br><span class="note">${p.role} · ${p.age} ans · pot. ${potLabel(p)} · ${p.teamId ? esc(T(p.teamId).name) : "Libre"}</span></span>
        <span class="px"><span class="lab">Salaire demandé</span><b>${M(E.salaryDemand(p))}</b>${fee ? `<span class="note">Transfert ${M(fee)}</span>` : ""}</span>
      </button>`;
    }).join("") || '<p class="note">Personne dans cette catégorie.</p>'}</div></section>`;
}

/* ---------- Compétition ---------- */
function vCompetition() {
  const tabs = [["cdl", "Classement"], ["qual", "Qualifs"], ["bracket", "Tournoi"], ["cal", "Calendrier"], ["hist", "Palmarès"]];
  let body = "";
  if (ui.comp === "cdl") body = vPointsTable(false);
  else if (ui.comp === "qual") body = vSideTableFull();
  else if (ui.comp === "bracket") body = vBracket();
  else if (ui.comp === "cal") body = vCalendar();
  else body = vHistory();
  return `<div class="stack"><div class="chips">${tabs.map(([k, v]) => `<button class="chip" data-act="comp" data-v="${k}" aria-pressed="${ui.comp === k}">${v}</button>`).join("")}</div>${body}</div>`;
}
function vSideTableFull() {
  const t = E.qualTable(S);
  return `<section class="sec"><h3>Qualifs en cours</h3><div class="tw"><table><thead><tr><th>#</th><th>Équipe</th><th class="n">V</th><th class="n">D</th><th class="n">Diff. maps</th><th class="n">Force</th></tr></thead><tbody>${t.map((r, i) => `<tr class="${r.id === S.userTeam ? "me" : ""} ${i === 7 ? "cut" : ""}"><td class="mono">${i + 1}</td><td>${crest(r.id, "sm")} ${esc(T(r.id).name)}</td><td class="n">${r.w}</td><td class="n">${r.l}</td><td class="n">${r.md > 0 ? "+" : ""}${r.md}</td><td class="n">${fmt1(E.teamRating(S, r.id))}</td></tr>`).join("")}</tbody></table></div></section>`;
}
function vBracket() {
  const B = S.bracket;
  if (!B) return `<p class="note">Aucun tournoi en cours. Le prochain commence après la 5e journée de qualifs.</p>`;
  const col = (st) => {
    const pairs = B.rounds[st] || [];
    const res = B.results[st] || [];
    const n = [4, 2, 1][st];
    const items = [];
    for (let i = 0; i < n; i++) {
      const p = pairs[i]; const r = p && res.find(x => x.a === p[0] && x.b === p[1]);
      const line = (id, j) => { if (!id) return `<div class="ls">À déterminer</div>`; const cls = r ? (r.winner === id ? "wn" : "ls") : ""; return `<div class="${cls} ${id === S.userTeam ? "me" : ""}">${crest(id, "sm")} ${esc(T(id).tag)}<span class="s">${r ? r.wins[j] : ""}</span></div>`; };
      items.push(`<div class="bm">${line(p && p[0], 0)}${line(p && p[1], 1)}</div>`);
    }
    return `<div class="bcol"><span class="lab">${B.stageNames[st]}${st === B.stage && !B.done ? " · en cours" : ""}</span>${items.join("")}</div>`;
  };
  return `<section class="sec"><h3>${esc(B.name)}${B.champion ? " · vainqueur " + esc(T(B.champion).name) : ""}</h3><div class="tw"><div class="bracket">${col(0)}${col(1)}${col(2)}</div></div></section>`;
}
function vCalendar() {
  const rows = S.schedule.map((st, i) => {
    let name, res = "";
    if (st.type === "qual") {
      name = `Major ${st.major + 1} · Qualifs J${st.round + 1}`;
      const p = st.pairs.find(x => x.includes(S.userTeam));
      const opp = p ? (p[0] === S.userTeam ? p[1] : p[0]) : null;
      const r = S.results.find(r => r.label === `Major ${st.major + 1} · Qualifs, journée ${st.round + 1}` && (r.a === S.userTeam || r.b === S.userTeam));
      res = opp ? `contre ${esc(T(opp).name)}` + (r ? ` · <b class="${r.winner === S.userTeam ? "win" : "loss"}">${r.winner === S.userTeam ? "V" : "D"} ${r.wins[r.a === S.userTeam ? 0 : 1]}-${r.wins[r.a === S.userTeam ? 1 : 0]}</b>` : "") : "";
    } else {
      name = st.type === "champs" ? "CDL Champs" : `Major ${st.major + 1} · Tournoi`;
      const m = st.type === "champs" ? S.champsResult : S.majors[st.major];
      if (m) { const pl = m.place.indexOf(S.userTeam); res = `Vainqueur : ${esc(T(m.champion).name)} · toi : ${pl >= 0 ? pl + 1 + "e" : "-"}`; }
    }
    return `<tr class="${i === S.step && S.phase === "season" ? "me" : ""}"><td class="mono">${i + 1}</td><td>${name}</td><td>${res}</td></tr>`;
  });
  return `<section class="sec"><h3>Calendrier ${S.season}</h3><div class="tw"><table><thead><tr><th>#</th><th>Étape</th><th>Résultat</th></tr></thead><tbody>${rows.join("")}</tbody></table></div></section>`;
}
function vHistory() {
  const top = Object.values(S.players).filter(p => p.ss.maps >= 6).sort((a, b) => b.ss.k / Math.max(1, b.ss.d) - a.ss.k / Math.max(1, a.ss.d)).slice(0, 10);
  return `<section class="sec"><h3>Ton palmarès</h3><p>${S.titles.length ? S.titles.map(esc).join(" · ") : '<span class="note">Pas encore de titre.</span>'}</p>

/* ---------- Match en direct ---------- */
const GS_PER_SEC = 4;
function seedRand(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }

  const hills = [];
  for (let i = 0; i < 5; i++) hills.push({ x: 26 + r() * 48, y: 10 + r() * 40 });
  return { blocks, hills, sites: { A: { x: 50 + (r() - .5) * 14, y: 13 }, B: { x: 50 + (r() - .5) * 14, y: 47 } }, zones: [{ x: 38 + r() * 8, y: 18 + r() * 8 }, { x: 55 + r() * 8, y: 36 + r() * 8 }] };
}
function spawnPos(side, k) { return { x: side === 0 ? 5 + (k % 2) * 2.5 : 95 - (k % 2) * 2.5, y: 22 + k * 5.5 }; }
function initDots(L) {
  const sim = L.sim; const dots = {};
  sim.sides.forEach((s, si) => s.players.forEach((p, k) => { const sp = spawnPos(si, k); dots[p.id] = { x: sp.x, y: sp.y, tx: sp.x, ty: sp.y, side: si, k, alive: true, dx: 0, dy: 0, dt: 0 }; }));

}
function objPoint(L, si) {

}
const R2 = Math.random;
function startLive() {
  const pair = E.userPair(S); if (!pair) return;
  const ser = E.newSeries(S, pair.a, pair.b, pair.firstTo, pair.label);
  ui.match = { ser, side: pair.a === S.userTeam ? 0 : 1, tac: S.tactic, speed: 3, paused: false, sim: null, phase: "map", dots: null, tracers: [], feed: [], evIdx: 0, acc: 0, last: 0, colors: sideColors(pair.a, pair.b) };

}
function nextMap() {

  const ids = [L.ser.a, L.ser.b];
  const tac = [0, 1].map(i => i === L.side ? L.tac : E.aiTactic(S, ids[i]));
  L.sim = E.createMapSim(S, m.mode, m.map, ids, tac);

}

    const e = sim.events[L.evIdx++];
    if (e.type === "kill") { const k = L.dots[e.killer], v = L.dots[e.victim]; if (k && v) L.tracers.push({ x1: k.x, y1: k.y, x2: v.x, y2: v.y, life: .45, side: e.side }); if (v) { v.dx = v.x; v.dy = v.y; v.dt = 1.4; } }

    const d = L.dots[p.id];
    if (!p.alive) { d.alive = false; return; }

  const sim = L.sim;

  if (sim.mode === "HP") {
    L.layout.hills.forEach((h, i) => { g.strokeStyle = i === sim.hill ? "#eaf0f1" : "rgba(234,240,241,.12)"; g.setLineDash(i === sim.hill ? [] : [3, 4]); g.lineWidth = i === sim.hill ? 2 : 1; g.beginPath(); g.arc(h.x * sx, h.y * sy, 7 * sx, 0, 7); g.stroke(); });

  } else if (sim.mode === "SND") {
    for (const k of ["A", "B"]) { const s = L.layout.sites[k]; const act = sim.planted && sim.site === k; g.strokeStyle = act ? "#ff7a6b" : "#8fa3aa"; g.lineWidth = act ? 2.5 : 1.5; g.strokeRect((s.x - 5) * sx, (s.y - 5) * sy, 10 * sx, 10 * sy); g.fillStyle = act ? "#ff7a6b" : "#8fa3aa"; g.fillText(k, s.x * sx, s.y * sy); }
    if (sim.planted) { const s = L.layout.sites[sim.site]; const left = Math.max(0, 45 - (sim.rt - sim.plantT)); g.fillStyle = "#ff7a6b"; g.fillText(`${left}s`, s.x * sx, (s.y + 8) * sy); }
  } else {
    L.layout.zones.forEach((z, i) => {
      const done = sim.prog >= (i + 1) * 100, cur = Math.floor(sim.prog / 100) === i;
      g.strokeStyle = done ? col(sim.att) : cur ? "#eaf0f1" : "rgba(234,240,241,.25)"; g.lineWidth = 2; g.beginPath(); g.arc(z.x * sx, z.y * sy, 6 * sx, 0, 7); g.stroke();
      const pr = Math.max(0, Math.min(100, sim.prog - i * 100)) / 100;
      if (pr > 0) { g.strokeStyle = col(sim.att); g.lineWidth = 4; g.beginPath(); g.arc(z.x * sx, z.y * sy, 6 * sx + 4, -Math.PI / 2, -Math.PI / 2 + pr * Math.PI * 2); g.stroke(); }
      g.fillStyle = "#eaf0f1"; g.fillText(i ? "B" : "A", z.x * sx, z.y * sy);
    });
  }
  for (const t of L.tracers) { g.strokeStyle = col(t.side); g.globalAlpha = Math.min(1, t.life * 2.4); g.lineWidth = 1.6; g.beginPath(); g.moveTo(t.x1 * sx, t.y1 * sy); g.lineTo(t.x2 * sx, t.y2 * sy); g.stroke(); }
  g.globalAlpha = 1;
  const r = Math.max(4, W / 115);
  for (const id in L.dots) {
    const d = L.dots[id];
    if (!d.alive) { if (d.dt > 0) { g.strokeStyle = col(d.side); g.globalAlpha = Math.min(1, d.dt); g.lineWidth = 2; g.beginPath(); g.moveTo(d.dx * sx - r, d.dy * sy - r); g.lineTo(d.dx * sx + r, d.dy * sy + r); g.moveTo(d.dx * sx + r, d.dy * sy - r); g.lineTo(d.dx * sx - r, d.dy * sy + r); g.stroke(); g.globalAlpha = 1; } continue; }
    g.fillStyle = col(d.side); g.beginPath(); g.arc(d.x * sx, d.y * sy, r, 0, 7); g.fill();

  }
}
function loop(ts) {
  const L = ui.match; if (!L) return;
  const dt = L.last ? Math.min(.1, (ts - L.last) / 1000) : 0; L.last = ts;
  if (L.phase === "map" && !L.paused) {
    L.acc += dt * GS_PER_SEC * L.speed;
    while (L.acc >= 1 && !L.sim.done) { E.stepMap(L.sim); L.acc -= 1; }
    pumpEvents();
    moveDots(dt);
    if (L.sim.done) endMap();
    updateLive();
  } else if (L.phase === "map") moveDots(0);
  draw();
  requestAnimationFrame(loop);
}
function endMap() {
  const L = ui.match;
  pumpEvents();
  E.recordMap(S, L.ser, L.sim);
  L.phase = L.ser.done ? "end" : "between";
  renderMatch();
}
function timeStr(sim) {
  if (sim.mode === "HP") { const s = Math.max(0, sim.limit - sim.t); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
  return `Manche ${sim.round + 1} · ${sim.rt}s`;
}
function updateLive() {
  const L = ui.match, sim = L.sim; const me = L.side;
  const sc = $("#msc"); if (!sc) return;
  sc.innerHTML = `<span>${sim.score[0]}</span><span class="dim">-</span><span>${sim.score[1]}</span>`;
  $("#mtime").textContent = timeStr(sim);
  let extra = "";
  if (sim.mode === "SND") extra = `Attaque : ${esc(T(sim.sides[sim.att].id).tag)} · en vie ${E.aliveOf(sim.sides[0]).length}v${E.aliveOf(sim.sides[1]).length}`;
  if (sim.mode === "CTRL") extra = `Attaque : ${esc(T(sim.sides[sim.att].id).tag)} · vies ${sim.lives[0]}-${sim.lives[1]}`;
  if (sim.mode === "HP") extra = sim.holder >= 0 ? `Colline tenue par ${esc(T(sim.sides[sim.holder].id).tag)}` : "Colline libre";
  $("#mextra").textContent = extra;
  const [ca, cb] = L.colors;
  $("#feed").innerHTML = L.feed.map(e => `<li class="${e.type === "big" || e.type === "round" || e.type === "end" ? "big" : ""}" style="--c:${e.side === 0 ? ca : e.side === 1 ? cb : "var(--line2)"}">${esc(e.text)}</li>`).join("");
  const to = $("#mto"); if (to) { const left = 2 - sim.sides[me].timeouts; to.textContent = `Temps mort (${left})`; to.disabled = left <= 0; }
}
function scoreboard(sim) {
  return `<div class="tw"><table class="score-t"><thead><tr><th>Joueur</th><th class="n">K</th><th class="n">D</th><th class="n">+/-</th></tr></thead><tbody>${sim.sides.map((s, i) => s.players.slice().sort((a, b) => b.k - a.k).map(p => `<tr class="${i === ui.match.side ? "me" : ""}"><td>${esc(T(s.id).tag)} · ${esc(p.name)}</td><td class="n">${p.k}</td><td class="n">${p.d}</td><td class="n ${p.k >= p.d ? "win" : "loss"}">${p.k - p.d > 0 ? "+" : ""}${p.k - p.d}</td></tr>`).join("")).join("")}</tbody></table></div>`;
}
function renderMatch() {
  const L = ui.match, ser = L.ser, sim = L.sim, me = L.side;
  const plan = ser.plan[ser.maps.length - (L.phase === "map" ? 0 : 1)] || ser.plan[ser.maps.length - 1];
  const [ca, cb] = L.colors;
  let ctrl = "";
  if (L.phase === "map") {
    ctrl = `<div class="panel ctrl">
      <span class="lab">Vitesse</span>
      <div class="chips">${[1, 3, 8].map(v => `<button class="chip" data-act="spd" data-v="${v}" aria-pressed="${L.speed === v && !L.paused}">x${v}</button>`).join("")}<button class="chip" data-act="pause" aria-pressed="${L.paused}">${L.paused ? "Reprendre" : "Pause"}</button></div>
      <span class="lab">Tactique en direct</span>
      <div class="chips">${Object.entries(E.TACTICS).map(([k, v]) => `<button class="chip" data-act="ltac" data-v="${k}" aria-pressed="${sim.sides[me].tac === k}">${v.label}</button>`).join("")}</div>
      <div class="rowx"><button class="btn sm ghost" id="mto" data-act="timeout">Temps mort</button><button class="btn sm ghost" data-act="skipmap">Finir la map</button></div>
      <p class="note">Le temps mort casse la dynamique adverse. Deux par map.</p>
    </div>`;
  } else {
    const won = ser.maps[ser.maps.length - 1].winner === me;
    const last = ser.maps[ser.maps.length - 1];
    if (L.phase === "between") {
      const nx = ser.plan[ser.maps.length];
      ctrl = `<div class="panel ctrl"><span class="lab">Map ${ser.maps.length} terminée</span><h2 class="${won ? "win" : "loss"}">${won ? "Map gagnée" : "Map perdue"} ${last.score[me]}-${last.score[1 - me]}</h2>
        <span class="lab">Prochaine map : ${E.MODES[nx.mode]} · ${esc(nx.map)}</span>
        <span class="lab">Tactique pour la prochaine map</span>
        <div class="chips">${Object.entries(E.TACTICS).map(([k, v]) => `<button class="chip" data-act="ntac" data-v="${k}" aria-pressed="${L.tac === k}">${v.label}</button>`).join("")}</div>
        <div class="rowx"><button class="btn" data-act="nextmap">Map suivante</button><button class="link" data-act="simrest">Simuler la fin de la série</button></div></div>`;
    } else {
      const sw = ser.winner === S.userTeam;
      ctrl = `<div class="panel ctrl"><span class="lab">Série terminée</span><h2 class="${sw ? "win" : "loss"}">${sw ? "Victoire" : "Défaite"} ${ser.wins[me]}-${ser.wins[1 - me]}</h2>
        <div class="maps">${ser.maps.map(m => `<div class="mapc ${m.winner === me ? "w" : "l"}"><span class="lab">${m.mode}</span><b>${m.score[me]}-${m.score[1 - me]}</b><span>${esc(m.map)}</span></div>`).join("")}</div>
        <div><button class="btn" data-act="leave">Retour au QG</button></div></div>`;
    }
  }
  $("#app").innerHTML = `<div class="live" style="--team:${esc(ut().color)}">
    <div class="rowx"><span class="lab">${esc(ser.label)} · Bo${ser.firstTo * 2 - 1}</span></div>
    <div class="lhead">
      <div class="t">${crest(ser.a, "lg")}<b>${esc(T(ser.a).name)}</b></div>
      <div class="sw"><span style="color:${ca}">${ser.wins[0]}</span><small>MAPS</small><span style="color:${cb}">${ser.wins[1]}</span></div>
      <div class="t r"><b>${esc(T(ser.b).name)}</b>${crest(ser.b, "lg")}</div>
    </div>
    <div class="mapbar"><div><span class="lab">Map ${ser.maps.length + (L.phase === "map" ? 1 : 0)} · ${E.MODES[sim.mode]}</span><br><b style="font:800 22px/1 var(--display)">${esc(sim.map)}</b></div><div><span class="lab" id="mtime"></span><br><span class="note" id="mextra"></span></div><div class="sc" id="msc"></div></div>
    <div class="lgrid">
      <div class="stack"><canvas id="arena" class="arena" aria-label="Mini-carte du match"></canvas>
        <ul class="feed" id="feed" aria-live="off"></ul></div>
      <div class="stack">${ctrl}${L.phase !== "map" ? scoreboard(sim) : ""}</div>
    </div>
  </div>`;
  updateLive();
  draw();
}
const LIVE = {
  spd: el => { ui.match.speed = +el.dataset.v; ui.match.paused = false; renderMatch(); },
  pause: () => { ui.match.paused = !ui.match.paused; renderMatch(); },
  ltac: el => { E.setTactic(ui.match.sim, ui.match.side, el.dataset.v); ui.match.tac = el.dataset.v; renderMatch(); },
  ntac: el => { ui.match.tac = el.dataset.v; renderMatch(); },
  timeout: () => { if (E.timeout(ui.match.sim, ui.match.side)) { pumpEvents(); updateLive(); } },
  skipmap: () => { const L = ui.match; E.runMap(L.sim); L.feed = []; L.evIdx = Math.max(0, L.sim.events.length - 9); pumpEvents(); endMap(); },
  nextmap: () => { nextMap(); renderMatch(); },
  simrest: () => {
    const L = ui.match;
    while (!L.ser.done) { nextMap(); E.runMap(L.sim); L.evIdx = Math.max(0, L.sim.events.length - 9); L.feed = []; pumpEvents(); E.recordMap(S, L.ser, L.sim); }
    L.phase = "end"; renderMatch();
  },
  leave: () => { const ser = ui.match.ser; ui.match = null; doAdvance(ser); },
};

/* ---------- Démarrage ---------- */
function start(data) {
  if (data && data.S) S = data.S; else S = loadSave();
  render();
}
if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
