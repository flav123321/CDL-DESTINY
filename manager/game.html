<title>CDL Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*__FONTS__*/
/* Concept : la régie d'une organisation esport. Bandeau de l'équipe en haut, piste de saison, puis le travail de la semaine. Thème sombre unique, assumé. */
:root{
  color-scheme:dark;
  --bg:#0c1417; --panel:#132026; --panel2:#1a2a31; --line:#2a3d45; --line2:#36505a;
  --fg:#eaf0f1; --dim:#8fa3aa; --accent:#f5a524; --accent-ink:#1b1204;
  --win:#55d394; --loss:#ff7a6b; --warn:#f5c451;
  --team:#f5a524;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
#app{max-width:1160px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.dim{color:var(--dim)}
.win{color:var(--win)} .loss{color:var(--loss)} .warn{color:var(--warn)}
.flag{font-style:normal;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;margin-right:4px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;font:800 19px/1 var(--display);letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);padding-right:26px;text-align:center}
.btn.ghost{background:var(--panel2);color:var(--fg)}
.btn.sm{min-height:36px;font-size:16px;padding:7px 14px;padding-right:22px}
.btn.danger{background:var(--loss);color:#1c0503}
.link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;min-height:36px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:15px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{font-weight:500;opacity:.8}

/* Écusson : simple pastille avec le tag */
.crest{display:inline-grid;place-items:center;min-width:42px;height:30px;padding:0 6px;background:var(--c);color:#0b1013;font:900 15px/1 var(--display);letter-spacing:.03em;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%)}
.crest.lg{min-width:62px;height:46px;font-size:22px}
.crest.sm{min-width:34px;height:24px;font-size:12px}

/* Bandeau */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:14px;position:relative}
.hud::before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--team) 0 120px,transparent 120px)}
.brand{font:900 13px/1 var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.who{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
.who h1{font-size:clamp(28px,5vw,38px);overflow-wrap:anywhere}
.nums{display:flex;flex-wrap:wrap;gap:8px 22px}
.nums b{display:block;font:800 24px/1 var(--display)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{padding:8px 13px;font:800 19px/1 var(--display);color:var(--dim);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current=true]{color:var(--fg);border-color:var(--accent)}
nav .dot{display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;margin-left:5px;vertical-align:4px}

/* Piste de saison */
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.leg{display:flex;flex-direction:column;gap:4px;min-width:0}
.leg .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticks{display:flex;gap:2px}
.tk{flex:1;height:18px;background:var(--panel);clip-path:polygon(0 0,calc(100% - 4px) 0,100% 50%,calc(100% - 4px) 100%,0 100%,4px 50%)}
.tk.w{background:var(--win)} .tk.l{background:var(--loss)} .tk.o{background:var(--line2)}
.tk.now{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
.tk.gold{background:#ffd75e}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.tk.now{animation:none}}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.cols>*{min-width:0}
@media(max-width:880px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec>h2{font-size:24px}
.sec>h3{font-size:20px}
.panel{background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rowx{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.spacer{flex:1}

/* Prochain match */
.fixture{background:linear-gradient(115deg,color-mix(in srgb,var(--ca) 22%,var(--panel)) 0 50%,color-mix(in srgb,var(--cb) 22%,var(--panel)) 50% 100%);padding:18px;display:flex;flex-direction:column;gap:14px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.vs .side{display:flex;flex-direction:column;gap:6px;min-width:0}
.vs .side.r{align-items:flex-end;text-align:right}
.vs h2{font-size:clamp(22px,4.5vw,32px);overflow-wrap:anywhere}
.vs .x{font:900 28px/1 var(--display);color:var(--dim)}
.force{font:800 34px/1 var(--display)}
.note{font-size:14px;color:var(--dim)}
.alert{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border-left:3px solid var(--warn);padding:10px 12px;font-size:15px}
.alert.bad{background:color-mix(in srgb,var(--loss) 14%,var(--panel));border-color:var(--loss)}
.alert.good{background:color-mix(in srgb,var(--win) 12%,var(--panel));border-color:var(--win)}

/* Résultat */
.result{border:1px solid var(--line2);padding:16px;display:flex;flex-direction:column;gap:10px}
.bigscore{font:900 48px/.9 var(--display)}
.maps{display:flex;flex-wrap:wrap;gap:6px}
.mapc{background:var(--panel2);padding:6px 10px;font-size:14px;display:flex;flex-direction:column;min-width:0}
.mapc b{font:800 18px/1.1 var(--display)}
.mapc.w{box-shadow:inset 0 -3px 0 var(--win)} .mapc.l{box-shadow:inset 0 -3px 0 var(--loss)}

/* Messages */
.msg{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-left:3px solid transparent}
.msg.need{border-left-color:var(--accent)}
.msg h3{font-size:21px}
.msg .opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);min-height:44px}
.opt:hover{border-color:var(--accent)}
.opt small{color:var(--dim);font-size:13.5px}
.msg .res{font-size:14px;color:var(--win)}

/* Fil d'actu */
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.news li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.news li .lab{padding-top:2px}
.news li.good{color:#cdeedd} .news li.bad{color:#ffd2cb} .news li.board{color:#ffe2a8}

/* Tables */
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.me td{background:color-mix(in srgb,var(--team) 14%,transparent)}
tr.cut td{border-bottom:2px dashed var(--line2)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}

/* Joueurs */
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{background:var(--panel);display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 14px;padding:12px 14px;align-items:center;border-left:3px solid var(--line2)}
.pcard.st{border-left-color:var(--team)}
.pcard .ov{font:900 40px/.85 var(--display);color:var(--accent);text-align:center}
.pcard .ov small{display:block;font:500 10px/1.2 var(--mono);color:var(--dim);letter-spacing:.08em}
.pcard .nm{font:800 22px/1.05 var(--display);overflow-wrap:anywhere}
.pcard .meta{font-size:13.5px;color:var(--dim)}
.pcard .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pcard .more{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13.5px}
@media(max-width:560px){.pcard{grid-template-columns:46px minmax(0,1fr)}.pcard .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center}.pcard .ov{font-size:34px}}
.bars{display:grid;grid-template-columns:repeat(4,minmax(52px,1fr));gap:4px 10px;min-width:0}
.pcard .more .bars{flex:1 1 260px}
.bar{display:flex;flex-direction:column;gap:2px;font-size:12px}
.bar span{display:flex;justify-content:space-between;color:var(--dim);font-family:var(--mono);font-size:11px}
.bar i{display:block;height:5px;background:var(--panel2);position:relative}
.bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--fg);opacity:.85}
.st3{display:inline-flex;gap:4px;align-items:center;font-family:var(--mono);font-size:12.5px}
.st3 i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
select.sel{background:var(--panel2);border:1px solid var(--line2);padding:6px 8px;min-height:36px;font-size:14.5px}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel);padding:10px 12px;cursor:pointer;border:1px solid transparent;width:100%}
.mrow:hover{border-color:var(--line2)}
.mrow .ov{font:900 30px/.9 var(--display);color:var(--accent);text-align:center}
.mrow .nm{font:800 19px/1.1 var(--display);overflow-wrap:anywhere}
.mrow .px{text-align:right;font-size:13.5px}
.mrow .px b{display:block;font:700 15px/1.2 var(--mono)}

/* Feuille (détail joueur / offre) */
.sheet-bg{position:fixed;inset:0;background:rgba(3,8,10,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--bg);border-top:3px solid var(--accent);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border:1px solid var(--line2);border-top:3px solid var(--accent)}}
.sheet h2{font-size:34px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kv div{background:var(--panel);padding:8px 10px}
.kv b{display:block;font:800 22px/1.1 var(--display)}
input[type=range]{width:100%;accent-color:var(--accent)}
input.txt,textarea{background:var(--panel2);border:1px solid var(--line2);padding:10px;width:100%;color:var(--fg);font:15px/1.4 var(--body)}
textarea{font:12px/1.4 var(--mono);min-height:90px;resize:vertical}
.odds{font:800 20px/1 var(--display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;font-weight:600;z-index:60;max-width:min(92vw,520px);box-shadow:0 8px 28px rgba(0,0,0,.45)}

/* Tournoi */
.bracket{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:14px;min-width:560px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bm{background:var(--panel);display:flex;flex-direction:column}
.bm div{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:14.5px}
.bm div+div{border-top:1px solid var(--line)}
.bm .s{margin-left:auto;font:700 15px var(--mono)}
.bm .wn{font-weight:700} .bm .ls{color:var(--dim)}
.bm .me{background:color-mix(in srgb,var(--team) 16%,transparent)}

/* Accueil / création */
.hero{display:flex;flex-direction:column;gap:12px;padding-block:18px 6px}
.hero h1{font-size:clamp(48px,11vw,96px);font-weight:900;line-height:.86;letter-spacing:-.005em}
.hero h1 span{color:var(--accent)}
.hero p{max-width:62ch;color:var(--dim);font-size:17px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tpick{background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent;min-height:44px}
.tpick[aria-pressed=true]{border-color:var(--accent);background:var(--panel2)}
.tpick b{font:800 19px/1.05 var(--display)}
.tpick small{color:var(--dim);font-size:13px}

/* Match en direct */
.live{display:flex;flex-direction:column;gap:12px}
.lhead{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.lhead .t{display:flex;align-items:center;gap:10px;min-width:0}
.lhead .t.r{justify-content:flex-end}
.lhead .t b{font:800 clamp(18px,3.6vw,26px)/1 var(--display);overflow-wrap:anywhere}
.lhead .sw{font:900 clamp(30px,7vw,48px)/1 var(--display);display:flex;gap:14px;align-items:center}
.lhead .sw small{font:500 11px var(--mono);color:var(--dim);letter-spacing:.1em}
.mapbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;background:var(--panel);padding:10px 14px}
.mapbar .sc{font:900 34px/1 var(--display);margin-left:auto;display:flex;gap:10px;align-items:baseline}
.arena{width:100%;aspect-ratio:5/3;max-width:100%;display:block;background:#0a1114;border:1px solid var(--line)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"map ctrl" "sb feed";gap:14px;align-items:start}
.lgrid>*{min-width:0}
.lgrid .arena{grid-area:map}.lgrid .lctrl{grid-area:ctrl}.lgrid .sb{grid-area:sb}.lgrid .feed{grid-area:feed}
@media(max-width:880px){.lgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "feed" "ctrl" "sb"}}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;min-height:150px}
.feed li{padding:5px 8px;background:var(--panel);border-left:3px solid var(--c,var(--line2))}
.feed li.big{font-weight:700}
.ctrl{display:flex;flex-direction:column;gap:12px}
.score-t td,.score-t th{padding:5px 6px;font-size:14px}
.sb{display:flex;flex-direction:column;gap:8px}
.sbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:700px){.sbgrid{grid-template-columns:minmax(0,1fr)}}
.sbt{background:var(--panel);min-width:0;overflow-x:auto}
.sbh{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,var(--panel2)),var(--panel2));border-bottom:2px solid var(--c)}
.sbh b{font:800 18px/1 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sbs{font:900 26px/1 var(--display)}
.sbt table{font-size:14px}
.sbt th,.sbt td{padding:5px 8px}
.sbt tr.dead td{opacity:.42}
.sbt tfoot td{color:var(--dim);font-size:13px;border-bottom:0}
.sbt .rl{display:inline-block;min-width:34px;margin-right:6px;font:500 10px/1 var(--mono);color:var(--dim);letter-spacing:.06em}
.carry{color:var(--accent)}
@media(max-width:560px){.lhead .t b{display:none}.lhead .crest.lg{min-width:54px;height:40px;font-size:19px}.mapbar .sc{font-size:28px}}
@media(max-width:880px){.feed{min-height:0}.feed li:nth-child(n+4){display:none}}
</style>

<div id="app" aria-live="polite"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>/*__DATA__*/</script>
<script>/*__ENGINE__*/</script>
<script>
"use strict";
const E = window.ENGINE, D = window.CDLM_DATA;
E.setData(D);
const KEY = "cdl-manager-save-1";
let S = null;
const ui = { tab: "accueil", mk: "fa", mkRole: "all", comp: "cdl", sheet: null, flash: null, match: null, confirm: null, team: null, rename: { name: "", tag: "", color: "" }, manager: "" };

/* ---------- Sauvegarde ---------- */
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function loadSave() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(KEY); } catch (e) {} }

/* ---------- Outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const M = n => E.fmtMoney(n);
const T = id => S.teams[id];
const P = id => S.players[id];
const ut = () => S.teams[S.userTeam];
const fl = c => `<i class="flag">${E.flag(c)}</i>`;
const crest = (id, cls) => { const t = T(id); return `<span class="crest ${cls || ""}" style="--c:${esc(t.color)}" title="${esc(t.name)}">${esc(t.tag)}</span>`; };
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
const kd = (k, d) => (k / Math.max(1, d)).toFixed(2);
function toast(t) { const el = $("#toast"); el.innerHTML = `<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toast.h); toast.h = setTimeout(() => el.innerHTML = "", 3600); }
function potLabel(p) { if (p.teamId === S.userTeam) return String(p.pot); const lo = Math.max(E.pOvr(p), p.pot - 3), hi = Math.min(99, p.pot + 2); return lo === hi ? String(lo) : `${lo}-${hi}`; }
function lum(hex) { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }
function sideColors(a, b) {
  let ca = T(a).color, cb = T(b).color;
  const near = (x, y) => { const p = parseInt(x.slice(1), 16), q = parseInt(y.slice(1), 16); return Math.hypot(((p >> 16) & 255) - ((q >> 16) & 255), ((p >> 8) & 255) - ((q >> 8) & 255), (p & 255) - (q & 255)) < 120; };
  if (near(ca, cb)) cb = lum(cb) > .5 ? "#3fa7ff" : "#e9eef0";
  return [ca, cb];
}
function stepLabel() {
  const st = S.schedule[S.step];
  if (S.phase === "offseason") return `Intersaison ${S.season}`;
  if (!st) return "";
  if (st.type === "qual") return `Major ${st.major + 1} · Qualifs, journée ${st.round + 1}`;
  if (S.bracket) return `${S.bracket.name} · ${S.bracket.stageNames[S.bracket.stage] || ""}`;
  return "";
}
function myRecord() {
  let w = 0, l = 0;
  for (const r of S.results) { if (r.a === S.userTeam || r.b === S.userTeam) { if (r.winner === S.userTeam) w++; else l++; } }
  return [w, l];
}

/* ---------- Écran de départ ---------- */
function vStart() {
  const teams = D.teams.cdl.map(t => ({ ...t, avg: t.players.reduce((s, p) => s + p.rating, 0) / t.players.length }));
  teams.sort((a, b) => b.prestige - a.prestige);
  const sel = ui.team;
  const has = !!loadSave();
  return `
  <header class="hero">
    <div class="brand">Projet de fan · non officiel</div>
    <h1>CDL<br><span>MANAGER</span></h1>
    <p>Tu diriges une organisation de la Call of Duty League. Effectif, transferts, contrats, sponsors, entraînement, et les séries jouées en direct depuis la régie. Quatre Majors, puis les Champs.</p>
  </header>
  ${has ? `<div class="rowx"><button class="btn" data-act="continue">Reprendre ma partie</button><span class="note">Commencer une nouvelle partie remplace la sauvegarde.</span></div>` : ""}
  <section class="sec">
    <label class="lab" for="mgr">Ton nom de manager</label>
    <input id="mgr" class="txt" maxlength="24" placeholder="Ex. Flav" value="${esc(ui.manager)}" style="max-width:360px">
  </section>
  <section class="sec">
    <h2>Choisis ton organisation</h2>
    <p class="note">Les grosses écuries ont plus de budget, mais le conseil attend des titres.</p>
    <div class="tgrid">
      ${teams.map(t => `<button class="tpick" data-act="pick" data-id="${t.id}" aria-pressed="${sel === t.id}">
        <span class="rowx"><span class="crest" style="--c:${t.color}">${esc(t.tag)}</span><span class="spacer"></span><span class="mono dim">${Math.round(t.avg)}</span></span>
        <b>${esc(t.name)}</b>
        <small>${t.players.map(p => esc(p.name)).join(" · ")}</small>
      </button>`).join("")}
    </div>
  </section>
  ${sel ? `<section class="sec panel">
    <h3>Renommer l'orga (facultatif)</h3>
    <p class="note">Garde le nom actuel ou crée ta propre identité. Les joueurs restent les mêmes.</p>
    <div class="rowx">
      <input id="rn-name" class="txt" maxlength="28" placeholder="${esc(D.teams.cdl.find(t => t.id === sel).name)}" value="${esc(ui.rename.name)}" style="flex:2 1 200px">
      <input id="rn-tag" class="txt" maxlength="4" placeholder="Tag" value="${esc(ui.rename.tag)}" style="flex:1 1 80px;text-transform:uppercase">
      <input id="rn-color" type="color" value="${esc(ui.rename.color || D.teams.cdl.find(t => t.id === sel).color)}" style="width:54px;height:44px;border:0;background:none" aria-label="Couleur de l'orga">
    </div>
  </section>
  <div><button class="btn" data-act="start">Signer comme manager</button></div>` : ""}`;
}

/* ---------- Bandeau et piste ---------- */
function vHud() {
  const t = ut();
  const [w, l] = myRecord();
  const pend = E.pendingChoices(S).length;
  const tabs = [["accueil", "QG"], ["effectif", "Effectif"], ["marche", "Marché"], ["competition", "Compétition"], ["finances", "Finances"]];
  return `<header class="hud" style="--team:${esc(t.color)}">
    <div class="who">${crest(t.id, "lg")}<div style="min-width:0"><div class="brand">CDL Manager · Saison ${S.season}</div><h1>${esc(t.name)}</h1><div class="note">${esc(S.manager)} · ${esc(stepLabel())}</div></div></div>
    <div class="nums">
      <div><span class="lab">Trésorerie</span><b class="${S.finances.cash < 0 ? "loss" : ""}">${M(S.finances.cash)}</b></div>
      <div><span class="lab">Bilan séries</span><b>${w}-${l}</b></div>
      <div><span class="lab">Points CDL</span><b>${S.points[t.id] || 0}</b></div>
      <div><span class="lab">Conseil</span><b class="${S.board < 35 ? "loss" : S.board > 70 ? "win" : ""}">${Math.round(S.board)} %</b></div>
    </div>
  </header>
  <nav aria-label="Sections">${tabs.map(([k, v]) => `<button data-act="tab" data-v="${k}" aria-current="${ui.tab === k}">${v}${k === "accueil" && pend ? '<span class="dot" aria-label="choix en attente"></span>' : ""}</button>`).join("")}</nav>`;
}
function vTrack() {
  const legs = [];
  for (let m = 0; m < 4; m++) legs.push({ name: `Major ${m + 1}`, steps: S.schedule.map((s, i) => ({ s, i })).filter(x => x.s.major === m) });
  legs.push({ name: "Champs", steps: S.schedule.map((s, i) => ({ s, i })).filter(x => x.s.type === "champs") });
  const myRes = S.results.filter(r => r.a === S.userTeam || r.b === S.userTeam);
  let ri = 0;
  const cls = x => {
    if (S.phase === "offseason") return "o";
    if (x.i === S.step) return "now";
    if (x.i > S.step) return "";
    if (x.s.type === "qual") { const r = myRes.find(r => r.label.startsWith(`Major ${x.s.major + 1} · Qualifs, journée ${x.s.round + 1}`)); return r ? (r.winner === S.userTeam ? "w" : "l") : "o"; }
    const m = x.s.type === "champs" ? S.champsResult : S.majors[x.s.major];
    if (!m) return "o";
    const pl = m.place.indexOf(S.userTeam);
    return pl === 0 ? "gold" : pl >= 0 && pl < 4 ? "w" : "o";
  };
  return `<div class="track" aria-label="Progression de la saison">${legs.map(L => `<div class="leg"><span class="lab">${L.name}</span><div class="ticks">${L.steps.map(x => `<span class="tk ${cls(x)}" title="${x.s.type === "qual" ? "Qualifs J" + (x.s.round + 1) : "Tournoi"}"></span>`).join("")}</div></div>`).join("")}</div>`;
}

/* ---------- QG ---------- */
function vAccueil() {
  const out = [];
  if (S.over) out.push(`<section class="panel"><h2>Fin de l'aventure</h2><p>Le conseil t'a licencié après la saison ${S.season}. Ton palmarès : ${S.titles.length ? S.titles.map(esc).join(", ") : "aucun titre"}.</p><div><button class="btn" data-act="newgame">Nouvelle partie</button></div></section>`);
  if (ui.flash) out.push(vFlash(ui.flash));
  if (!S.over) out.push(S.phase === "offseason" ? vOffseason() : vFixture());
  if (!S.over && S.phase === "season") out.push(vWeekPlan());
  out.push(vInbox());
  return `<div class="cols"><div class="stack">${out.join("")}</div><aside class="stack">${vSideTable()}${vNews()}</aside></div>`;
}
function vFixture() {
  const pair = E.userPair(S);
  const pend = E.pendingChoices(S);
  const warn = E.roleCheck(S, S.userTeam);
  const blocked = pend.length > 0 || ut().roster.length < 4;
  const notes = [];
  if (pend.length) notes.push(`<div class="alert">Réponds ${pend.length > 1 ? "aux " + pend.length + " messages" : "au message"} en attente avant de jouer.</div>`);
  if (ut().roster.length < 4) notes.push(`<div class="alert bad">Il te faut au moins 4 joueurs. Recrute sur le marché.</div>`);
  else if (warn.length) notes.push(`<div class="alert">${warn.map(esc).join(" ")}</div>`);
  if (!pair) {
    return `<section class="panel"><span class="lab">${esc(stepLabel())}</span><h2>Ton équipe ne joue pas ce tour</h2><p class="note">${S.bracket && S.bracket.seeds.includes(S.userTeam) ? "Elle est éliminée de ce tournoi." : "Elle n'est pas qualifiée pour ce tournoi."} Tu peux simuler la suite du tournoi.</p>${notes.join("")}<div class="rowx"><button class="btn" data-act="sim" ${pend.length ? "disabled" : ""}>Simuler le tour</button></div></section>`;
  }
  const [ca, cb] = sideColors(pair.a, pair.b);
  const ra = E.teamRating(S, pair.a), rb = E.teamRating(S, pair.b);
  const side = (id, r, right) => `<div class="side ${right ? "r" : ""}">${crest(id)}<h2>${esc(T(id).name)}</h2><span class="note">Force</span><span class="force">${fmt1(r)}</span><span class="note">${E.starters(S, id).map(p => esc(p.name)).join(" · ")}</span></div>`;
  const bo = pair.firstTo * 2 - 1;
  return `<section class="fixture" style="--ca:${ca};--cb:${cb}">
    <div class="rowx"><span class="lab">Prochain match · ${esc(pair.label)}</span><span class="spacer"></span><span class="lab">Bo${bo} · premier à ${pair.firstTo}</span></div>
    <div class="vs">${side(pair.a, ra)}<span class="x">VS</span>${side(pair.b, rb, true)}</div>
    ${notes.join("")}
    <div class="rowx"><button class="btn" data-act="live" ${blocked ? "disabled" : ""}>Jouer en direct</button><button class="btn ghost" data-act="sim" ${blocked ? "disabled" : ""}>Simuler la série</button></div>
  </section>`;
}
function vFlash(o) {
  if (o.seasonEnd) {
    const h = o.seasonEnd;
    return `<section class="result"><span class="lab">Saison ${h.season} terminée</span><h2>${h.rank}e au classement CDL</h2><p>${h.ok ? '<span class="win">Objectif atteint.</span>' : '<span class="loss">Objectif manqué.</span>'} ${esc(h.objective)}</p>${h.mvp ? `<p class="note">Meilleur K/D de la saison : ${esc(h.mvp.name)} (${h.mvp.kd.toFixed ? h.mvp.kd.toFixed(2) : h.mvp.kd}).</p>` : ""}<div><button class="link" data-act="dismiss">Fermer</button></div></section>`;
  }
  const r = o.user;
  const others = (o.others || []).slice(0, 8);
  let html = "";
  if (r) {
    const me = r.a === S.userTeam ? 0 : 1, won = r.winner === S.userTeam;
    const opp = me === 0 ? r.b : r.a;
    const mv = r.mvp && P(r.mvp);
    html = `<span class="lab">${esc(r.label)}</span>
      <div class="rowx"><span class="bigscore ${won ? "win" : "loss"}">${r.wins[me]}-${r.wins[1 - me]}</span><div><h2>${won ? "Victoire" : "Défaite"} contre ${esc(T(opp).name)}</h2>${mv ? `<span class="note">MVP : ${esc(mv.name)} (${T(mv.teamId) ? esc(T(mv.teamId).tag) : ""}) · ${r.stats[r.mvp].k}/${r.stats[r.mvp].d}</span>` : ""}</div></div>
      <div class="maps">${r.maps.map(m => { const w = (m.winner === me); return `<div class="mapc ${w ? "w" : "l"}"><span class="lab">${E.MODES[m.mode]}</span><b>${m.score[me]}-${m.score[1 - me]}</b><span>${esc(m.map)}</span></div>`; }).join("")}</div>
      ${vMyStats(r)}`;
  } else html = `<span class="lab">${esc(o.label)}</span><h2>Tour simulé</h2>`;
  if (o.userPlace) html += `<div class="alert ${o.userPlace === 1 ? "good" : ""}">Tournoi terminé : ton équipe finit ${o.userPlace === 1 ? "championne !" : o.userPlace + "e."}</div>`;
  if (others.length) html += `<details><summary class="lab" style="cursor:pointer">Autres résultats (${o.others.length})</summary><ul class="news">${others.map(x => `<li><span class="mono">${x.wins[0]}-${x.wins[1]}</span><span>${x.winner === x.a ? "<b>" + esc(T(x.a).tag) + "</b> bat " + esc(T(x.b).tag) : "<b>" + esc(T(x.b).tag) + "</b> bat " + esc(T(x.a).tag)}</span></li>`).join("")}</ul></details>`;
  return `<section class="result">${html}<div><button class="link" data-act="dismiss">Fermer</button></div></section>`;
}
function vMyStats(r) {
  const mine = Object.entries(r.stats).filter(([id]) => P(id) && P(id).teamId === S.userTeam).sort((a, b) => b[1].k - a[1].k);
  if (!mine.length) return "";
  return `<div class="tw"><table><thead><tr><th>Joueur</th><th class="n">K</th><th class="n">D</th><th class="n">K/D</th></tr></thead><tbody>${mine.map(([id, s]) => `<tr><td>${esc(P(id).name)}</td><td class="n">${s.k}</td><td class="n">${s.d}</td><td class="n ${s.k >= s.d ? "win" : "loss"}">${kd(s.k, s.d)}</td></tr>`).join("")}</tbody></table></div>`;
}
function vWeekPlan() {
  return `<section class="sec"><h2>Plan de la semaine</h2>
    <div class="panel">
      <span class="lab">Entraînement</span>
      <div class="chips">${Object.entries(E.TRAINING).map(([k, v]) => `<button class="chip" data-act="train" data-v="${k}" aria-pressed="${S.training === k}">${v.label}</button>`).join("")}</div>
      <p class="note">${esc(E.TRAINING[S.training].desc)}</p>
      <span class="lab">Tactique de base en match</span>
      <div class="chips">${Object.entries(E.TACTICS).map(([k, v]) => `<button class="chip" data-act="tac" data-v="${k}" aria-pressed="${S.tactic === k}">${v.label}</button>`).join("")}</div>
      <p class="note">Hardpoint : ${esc(E.PLANS.HP[S.tactic].label)} · S&D : ${esc(E.PLANS.SND[S.tactic].label)} · Overload : ${esc(E.PLANS.OVL[S.tactic].label)}. Tu peux changer de plan avant chaque map et pendant le match.</p>
    </div></section>`;
}
function vInbox() {
  const list = S.inbox.slice(0, 8);
  if (!list.length) return "";
  const pend = list.filter(m => m.need && !m.answered), rest = list.filter(m => !(m.need && !m.answered));
  return `<section class="sec"><h2>Messages</h2>${pend.concat(rest).map(m => `<article class="msg ${m.need && !m.answered ? "need" : ""}">
    <span class="lab">${esc(m.from)} · S${m.s} sem. ${m.w}</span><h3>${esc(m.title)}</h3><p>${esc(m.text)}</p>
    ${m.options && !m.answered ? `<div class="opts">${m.options.map(o => `<button class="opt" data-act="ans" data-m="${m.id}" data-o="${o.id}"><span>${esc(o.label)}</span>${o.detail ? `<small>${esc(o.detail)}</small>` : ""}</button>`).join("")}</div>` : ""}
    ${m.answered && m.options ? `<p class="res">Choix : ${esc(m.options.find(o => o.id === m.answered).label)}${m.result ? " · " + esc(m.result) : ""}</p>` : ""}
  </article>`).join("")}</section>`;
}
function vNews() {
  return `<section class="sec"><h3>Actu de la ligue</h3><ul class="news">${S.news.slice(0, 12).map(n => `<li class="${n.kind}"><span class="lab">Sem.&nbsp;${n.w}</span><span>${esc(n.text)}</span></li>`).join("")}</ul></section>`;
}
function vSideTable() {
  const st = S.schedule[S.step];
  if (S.phase === "season" && st && st.type === "qual") {
    const t = E.qualTable(S);
    return `<section class="sec"><h3>Qualifs du Major ${st.major + 1}</h3><p class="note">Les 8 premiers jouent le tournoi.</p><div class="tw"><table><thead><tr><th>#</th><th>Équipe</th><th class="n">V-D</th><th class="n">Maps</th></tr></thead><tbody>${t.map((r, i) => `<tr class="${r.id === S.userTeam ? "me" : ""} ${i === 7 ? "cut" : ""}"><td class="mono">${i + 1}</td><td>${crest(r.id, "sm")} ${esc(T(r.id).tag)}</td><td class="n">${r.w}-${r.l}</td><td class="n">${r.md > 0 ? "+" : ""}${r.md}</td></tr>`).join("")}</tbody></table></div></section>`;
  }
  return vPointsTable(true);
}
function vPointsTable(small) {
  const t = E.pointsTable(S);
  return `<section class="sec"><h3>Classement CDL</h3>${small ? '<p class="note">Les 8 premiers vont aux Champs.</p>' : ""}<div class="tw"><table><thead><tr><th>#</th><th>Équipe</th><th class="n">Pts</th>${small ? "" : '<th class="n">Force</th>'}</tr></thead><tbody>${t.map((r, i) => `<tr class="${r.id === S.userTeam ? "me" : ""} ${i === 7 ? "cut" : ""}"><td class="mono">${i + 1}</td><td>${crest(r.id, "sm")} ${esc(small ? T(r.id).tag : T(r.id).name)}</td><td class="n">${r.pts}</td>${small ? "" : `<td class="n">${fmt1(E.teamRating(S, r.id))}</td>`}</tr>`).join("")}</tbody></table></div></section>`;
}
function vOffseason() {
  const t = ut();
  const exp = t.roster.map(P).filter(p => p.expiring);
  const ret = t.roster.map(P).filter(p => p.retireNext);
  const h = S.history[S.history.length - 1];
  return `<section class="panel"><span class="lab">Intersaison</span><h2>Prépare la saison ${S.season + 1}</h2>
    <p>Classement final ${h ? h.rank + "e" : ""}. Le marché est ouvert : prolonge tes joueurs, recrute des agents libres et des jeunes des Challengers.</p>
    ${exp.length ? `<div class="alert">Fin de contrat : ${exp.map(p => esc(p.name)).join(", ")}. Va dans Effectif pour les prolonger, sinon ils partent au lancement de la saison.</div>` : ""}
    ${ret.length ? `<div class="alert bad">Retraite annoncée : ${ret.map(p => esc(p.name)).join(", ")}. Trouve un remplaçant.</div>` : ""}
    <div class="rowx"><button class="btn" data-act="nextseason">Lancer la saison ${S.season + 1}</button><button class="btn ghost" data-act="tab" data-v="marche">Ouvrir le marché</button></div>
  </section>`;
}

/* ---------- Effectif ---------- */
function bars(p) {
  const b = (k, l) => `<div class="bar"><span>${l}<b>${Math.round(p[k])}</b></span><i style="--v:${Math.max(0, (p[k] - 50) * 2)}%"></i></div>`;
  return `<div class="bars">${b("aim", "Aim")}${b("move", "Mouv.")}${b("sense", "Lecture")}${b("mental", "Mental")}</div>`;
}
function cond(p) {
  const c = (v, good, bad) => v >= good ? "var(--win)" : v <= bad ? "var(--loss)" : "var(--warn)";
  return `<span class="st3" style="--c:${c(p.form, 1, -1.5)}"><i></i>Forme ${p.form > 0 ? "+" : ""}${fmt1(p.form)}</span>
    <span class="st3" style="--c:${c(p.morale, 65, 40)}"><i></i>Moral ${Math.round(p.morale)}</span>
    <span class="st3" style="--c:${c(100 - p.fatigue, 70, 45)}"><i></i>Fatigue ${Math.round(p.fatigue)}</span>`;
}
function vEffectif() {
  const t = ut();
  const ps = t.roster.map(P);
  const warn = E.roleCheck(S, t.id);
  const pay = E.payroll(S, t.id);
  const card = (p, i) => `<article class="pcard ${i < 4 ? "st" : ""}">
    <div class="ov">${E.pOvr(p)}<small>${p.role}</small></div>
    <div style="min-width:0"><div class="nm">${fl(p.nat)}${esc(p.name)}</div>
      <div class="meta">${i < 4 ? "Titulaire" : "Remplaçant"} · ${p.age} ans · pot. ${potLabel(p)} · ${M(p.salary)}/an · ${p.expiring ? '<span class="warn">fin de contrat</span>' : p.years + " saison" + (p.years > 1 ? "s" : "")}</div></div>
    <div class="acts">
      <select class="sel" data-act="role" data-id="${p.id}" aria-label="Rôle de ${esc(p.name)}">${E.ROLES.map(r => `<option ${r === p.role ? "selected" : ""}>${r}</option>`).join("")}</select>
      <select class="sel" data-act="slot" data-id="${p.id}" aria-label="Poste de ${esc(p.name)}">${ps.map((_, j) => `<option value="${j}" ${j === i ? "selected" : ""}>${j < 4 ? "Titulaire " + (j + 1) : "Remplaçant " + (j - 3)}</option>`).join("")}</select>
    </div>
    <div class="more">${bars(p)}<div class="rowx">${cond(p)}<span class="st3">K/D saison ${kd(p.ss.k, p.ss.d)}</span><button class="link" data-act="player" data-id="${p.id}">Contrat et détails</button></div></div>
  </article>`;
  return `<div class="cols"><div class="stack">
    <section class="sec"><h2>Effectif</h2><p class="note">4 titulaires, 2 remplaçants maximum. Les remplaçants récupèrent mais perdent du moral. Change le rôle d'un joueur si ta compo manque d'AR ou de SMG.</p>
    ${warn.length ? `<div class="alert">${warn.map(esc).join(" ")}</div>` : ""}
    <div class="plist">${ps.map(card).join("") || '<p class="note">Aucun joueur. Va sur le marché.</p>'}</div></section>
  </div><aside class="stack">
    <section class="panel"><span class="lab">Force d'équipe</span><b class="force">${fmt1(E.teamRating(S, t.id))}</b>
      <span class="lab">Cohésion</span><div class="bar"><span>Ensemble depuis des semaines<b>${Math.round(t.chem)}</b></span><i style="--v:${t.chem}%"></i></div>
      <span class="lab">Masse salariale</span><b class="mono">${M(pay)}/an</b>
      <p class="note">Une nouvelle recrue fait baisser la cohésion. L'entraînement Cohésion la fait remonter.</p></section>
    ${vPointsTable(true)}
  </aside></div>`;
}

/* ---------- Marché ---------- */
function vMarche() {
  const list = E.marketList(S, ui.mk).filter(p => ui.mkRole === "all" || p.role === ui.mkRole).slice(0, 40);
  const t = ut();
  return `<section class="sec"><h2>Marché des transferts</h2>
    <p class="note">${S.phase === "offseason" ? "Intersaison : c'est le meilleur moment pour recruter." : "Le marché reste ouvert pendant la saison."} Effectif : ${t.roster.length}/6. Trésorerie : ${M(S.finances.cash)}.</p>
    <div class="chips">${[["fa", "Agents libres"], ["ch", "Challengers"], ["cdl", "Équipes CDL"]].map(([k, v]) => `<button class="chip" data-act="mk" data-v="${k}" aria-pressed="${ui.mk === k}">${v}</button>`).join("")}</div>
    <div class="chips">${[["all", "Tous les rôles"], ["SMG", "SMG"], ["AR", "AR"], ["Flex", "Flex"]].map(([k, v]) => `<button class="chip" data-act="mkrole" data-v="${k}" aria-pressed="${ui.mkRole === k}">${v}</button>`).join("")}</div>
    <div class="plist">${list.map(p => {
      const fee = E.askingFee(S, p);
      return `<button class="mrow" data-act="player" data-id="${p.id}">
        <span class="ov">${E.pOvr(p)}</span>
        <span style="min-width:0"><span class="nm">${fl(p.nat)}${esc(p.name)}</span><br><span class="note">${p.role} · ${p.age} ans · pot. ${potLabel(p)} · ${p.teamId ? esc(T(p.teamId).name) : "Libre"}</span></span>
        <span class="px"><span class="lab">Salaire demandé</span><b>${M(E.salaryDemand(p))}</b>${fee ? `<span class="note">Transfert ${M(fee)}</span>` : ""}</span>
      </button>`;
    }).join("") || '<p class="note">Personne dans cette catégorie.</p>'}</div></section>`;
}

/* ---------- Compétition ---------- */
function vCompetition() {
  const tabs = [["cdl", "Classement"], ["qual", "Qualifs"], ["bracket", "Tournoi"], ["cal", "Calendrier"], ["hist", "Palmarès"]];
  let body = "";
  if (ui.comp === "cdl") body = vPointsTable(false);
  else if (ui.comp === "qual") body = vSideTableFull();
  else if (ui.comp === "bracket") body = vBracket();
  else if (ui.comp === "cal") body = vCalendar();
  else body = vHistory();
  return `<div class="stack"><div class="chips">${tabs.map(([k, v]) => `<button class="chip" data-act="comp" data-v="${k}" aria-pressed="${ui.comp === k}">${v}</button>`).join("")}</div>${body}</div>`;
}
function vSideTableFull() {

/* ---------- Match en direct ---------- */
const GS_PER_SEC = 4;          // secondes de jeu par seconde réelle, à vitesse x1
const RUN = 5.5;               // vitesse de course en unités de carte par seconde de jeu
const GW = 50, GH = 30, CS = 2; // grille de déplacement : 50 x 30 cases de 2 unités
function seedRand(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }

/* Plan de la carte : bâtiments inventés, grille de passage, objectifs placés sur des cases libres. */
function buildGrid(blocks) {
  const g = new Uint8Array(GW * GH);
  for (let cy = 0; cy < GH; cy++) for (let cx = 0; cx < GW; cx++) {
    const x = cx * CS + 1, y = cy * CS + 1;
    if (cx < 5 || cx > GW - 6) continue;
    for (const b of blocks) if (x > b.x - 1.2 && x < b.x + b.w + 1.2 && y > b.y - 1.2 && y < b.y + b.h + 1.2) { g[cy * GW + cx] = 1; break; }
  }
  // Ne garde que les cases reliées au spawn de gauche.
  const seen = new Uint8Array(GW * GH), q = [15 * GW + 1]; seen[q[0]] = 1;
  while (q.length) { const c = q.pop(), cx = c % GW, cy = (c / GW) | 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue; const n = ny * GW + nx; if (!g[n] && !seen[n]) { seen[n] = 1; q.push(n); } } }
  for (let i = 0; i < g.length; i++) if (!seen[i]) g[i] = 1;
  return { g, ok: seen[15 * GW + GW - 2] === 1 };
}
const cellOf = (x, y) => [Math.max(0, Math.min(GW - 1, Math.floor(x / CS))), Math.max(0, Math.min(GH - 1, Math.floor(y / CS)))];
function snap(lay, x, y) {
  const [cx, cy] = cellOf(x, y);
  for (let r = 0; r < 25; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    const nx = cx + dx, ny = cy + dy;
    if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
    if (!lay.g[ny * GW + nx]) return { x: nx * CS + 1, y: ny * CS + 1 };
  }
  return { x: 50, y: 30 };
}
function los(lay, a, b) {
  const d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.ceil(d / .7);
  for (let i = 1; i < n; i++) { const [cx, cy] = cellOf(a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n); if (lay.g[cy * GW + cx]) return false; }
  return true;
}
function astar(lay, from, to) {
  const [sx, sy] = cellOf(from.x, from.y), [tx, ty] = cellOf(to.x, to.y);
  const S0 = sy * GW + sx, T0 = ty * GW + tx;
  if (lay.g[T0]) return [to];
  const gS = new Float32Array(GW * GH).fill(1e9), prev = new Int32Array(GW * GH).fill(-1), closed = new Uint8Array(GW * GH);
  const open = [S0]; gS[S0] = 0;
  const h = c => { const dx = Math.abs(c % GW - tx), dy = Math.abs(((c / GW) | 0) - ty); return Math.max(dx, dy) + .41 * Math.min(dx, dy); };
  let guard = 0;
  while (open.length && guard++ < 3000) {
    let bi = 0; for (let i = 1; i < open.length; i++) if (gS[open[i]] + h(open[i]) < gS[open[bi]] + h(open[bi])) bi = i;
    const c = open.splice(bi, 1)[0];
    if (c === T0) break;
    closed[c] = 1;
    const cx = c % GW, cy = (c / GW) | 0;

  const L = ui.match, sim = L.sim, ser = L.ser, tabMap = L.sbTab === "map";

  const fmtObj = v => sim.mode === "HP" ? `${Math.floor(v / 60)}:${String(v % 60).padStart(2, "0")}` : String(v);
  const block = (s, i) => {
    let rows = s.players.map(p => {
      if (tabMap) return { p, k: p.k, d: p.d, obj: p.obj };
      const st = ser.stats[p.id] || { k: 0, d: 0 };
      const live = L.phase === "map" ? p : { k: 0, d: 0 };
      return { p, k: st.k + live.k, d: st.d + live.d };
    });
    rows.sort((a, b) => (b.k - b.d) - (a.k - a.d) || b.k - a.k);
    const c = i === 0 ? ca : cb;
    const total = rows.reduce((t, r) => [t[0] + r.k, t[1] + r.d], [0, 0]);
    return `<div class="sbt" style="--c:${c}">
      <div class="sbh">${crest(s.id, "sm")}<b>${esc(T(s.id).name)}</b><span class="spacer"></span><span class="sbs">${tabMap ? sim.score[i] : ser.wins[i]}</span></div>
      <table><thead><tr><th>Joueur</th><th class="n">K</th><th class="n">D</th><th class="n">+/-</th><th class="n">K/D</th>${tabMap ? `<th class="n">${OBJ_LABEL[sim.mode]}</th>` : ""}</tr></thead>
      <tbody>${rows.map(r => {
        const dead = tabMap && L.phase === "map" && !r.p.alive;
        const tagx = sim.mode === "OVL" && sim.carrier === r.p.id ? ' <span class="carry" title="Porte l\'engin">◆</span>' : sim.mode === "SND" && sim.planter === r.p.id && sim.planted ? ' <span class="carry" title="A posé la bombe">●</span>' : "";
        return `<tr class="${i === L.side ? "me" : ""} ${dead ? "dead" : ""}"><td><span class="rl">${esc(r.p.role)}</span>${esc(r.p.name)}${tagx}</td><td class="n">${r.k}</td><td class="n">${r.d}</td><td class="n ${r.k - r.d >= 0 ? "win" : "loss"}">${r.k - r.d > 0 ? "+" : ""}${r.k - r.d}</td><td class="n">${kd(r.k, r.d)}</td>${tabMap ? `<td class="n">${fmtObj(r.obj)}</td>` : ""}</tr>`;
      }).join("")}</tbody>
      <tfoot><tr><td>Équipe</td><td class="n">${total[0]}</td><td class="n">${total[1]}</td><td class="n">${total[0] - total[1] > 0 ? "+" : ""}${total[0] - total[1]}</td><td class="n">${kd(total[0], total[1])}</td>${tabMap ? "<td></td>" : ""}</tr></tfoot></table>
    </div>`;
  };
  return `<div class="rowx"><span class="lab">Tableau des scores</span><span class="spacer"></span><div class="chips"><button class="chip" data-act="sbtab" data-v="map" aria-pressed="${tabMap}">Cette map</button><button class="chip" data-act="sbtab" data-v="ser" aria-pressed="${!tabMap}">Série</button></div></div>
    <div class="sbgrid">${sim.sides.map(block).join("")}</div>`;
}
function planChips(mode, cur, act) {
  return `<div class="chips">${Object.keys(E.TACTICS).map(k => `<button class="chip" data-act="${act}" data-v="${k}" aria-pressed="${cur === k}">${E.PLANS[mode][k].label}</button>`).join("")}</div><p class="note">${esc(E.PLANS[mode][cur].desc)}</p>`;
}
function renderMatch() {
  const L = ui.match, ser = L.ser, sim = L.sim, me = L.side;
  const [ca, cb] = L.colors;
  let ctrl = "";
  if (L.phase === "map") {
    ctrl = `<div class="panel ctrl">
      <span class="lab">Vitesse</span>
      <div class="chips">${[1, 3, 8].map(v => `<button class="chip" data-act="spd" data-v="${v}" aria-pressed="${L.speed === v && !L.paused}">x${v}</button>`).join("")}<button class="chip" data-act="pause" aria-pressed="${L.paused}">${L.paused ? "Reprendre" : "Pause"}</button></div>
      <span class="lab">Plan de jeu · ${E.MODES[sim.mode]}</span>
      ${planChips(sim.mode, sim.sides[me].tac, "ltac")}
      <div class="rowx"><button class="btn sm ghost" id="mto" data-act="timeout">Temps mort</button><button class="btn sm ghost" data-act="skipmap">Finir la map</button></div>
      <p class="note">Le temps mort casse la dynamique adverse. Deux par map.</p>
    </div>`;
  } else {
    const last = ser.maps[ser.maps.length - 1];
    const won = last.winner === me;
    if (L.phase === "between") {
      const nx = ser.plan[ser.maps.length];
      ctrl = `<div class="panel ctrl"><span class="lab">Map ${ser.maps.length} terminée</span><h2 class="${won ? "win" : "loss"}">${won ? "Map gagnée" : "Map perdue"} ${last.score[me]}-${last.score[1 - me]}</h2>
        <span class="lab">Prochaine map : ${E.MODES[nx.mode]} · ${esc(nx.map)}</span>
        <span class="lab">Plan de jeu pour cette map</span>
        ${planChips(nx.mode, L.tac, "ntac")}
        <div class="rowx"><button class="btn" data-act="nextmap">Map suivante</button><button class="link" data-act="simrest">Simuler la fin de la série</button></div></div>`;
    } else {
      const sw = ser.winner === S.userTeam;
      ctrl = `<div class="panel ctrl"><span class="lab">Série terminée</span><h2 class="${sw ? "win" : "loss"}">${sw ? "Victoire" : "Défaite"} ${ser.wins[me]}-${ser.wins[1 - me]}</h2>
        <div class="maps">${ser.maps.map(m => `<div class="mapc ${m.winner === me ? "w" : "l"}"><span class="lab">${E.MODES[m.mode]}</span><b>${m.score[me]}-${m.score[1 - me]}</b><span>${esc(m.map)}</span></div>`).join("")}</div>
        <div><button class="btn" data-act="leave">Retour au QG</button></div></div>`;
    }
  }
  $("#app").innerHTML = `<div class="live" style="--team:${esc(ut().color)}">
    <div class="rowx"><span class="lab">${esc(ser.label)} · Bo${ser.firstTo * 2 - 1}</span></div>
    <div class="lhead">
      <div class="t">${crest(ser.a, "lg")}<b>${esc(T(ser.a).name)}</b></div>
      <div class="sw"><span style="color:${ca}">${ser.wins[0]}</span><small>MAPS</small><span style="color:${cb}">${ser.wins[1]}</span></div>
      <div class="t r"><b>${esc(T(ser.b).name)}</b>${crest(ser.b, "lg")}</div>
    </div>
    <div class="mapbar"><div><span class="lab">Map ${ser.maps.length + (L.phase === "map" ? 1 : 0)} · ${E.MODES[sim.mode]}</span><br><b style="font:800 22px/1 var(--display)">${esc(sim.map)}</b></div><div><span class="lab" id="mtime"></span><br><span class="note" id="mextra"></span></div><div class="sc" id="msc"></div></div>
    <div class="lgrid">
      <canvas id="arena" class="arena" aria-label="Mini-carte du match"></canvas>
      <div class="lctrl">${ctrl}</div>
      <section class="sb" id="sb">${scoreboard()}</section>
      <ul class="feed" id="feed" aria-live="off"></ul>
    </div>
  </div>`;
  updateLive();
  draw();
}
const LIVE = {
  spd: el => { ui.match.speed = +el.dataset.v; ui.match.paused = false; renderMatch(); },
  pause: () => { ui.match.paused = !ui.match.paused; renderMatch(); },
  ltac: el => { E.setTactic(ui.match.sim, ui.match.side, el.dataset.v); ui.match.tac = el.dataset.v; pumpEvents(); renderMatch(); },
  ntac: el => { ui.match.tac = el.dataset.v; renderMatch(); },
  sbtab: el => { ui.match.sbTab = el.dataset.v; $("#sb").innerHTML = scoreboard(); },
  timeout: () => { if (E.timeout(ui.match.sim, ui.match.side)) { pumpEvents(); updateLive(); } },
  skipmap: () => { const L = ui.match; E.runMap(L.sim); L.feed = []; L.evIdx = Math.max(0, L.sim.events.length - 9); pumpEvents(); endMap(); },
  nextmap: () => { nextMap(); renderMatch(); },
  simrest: () => {
    const L = ui.match;
    while (!L.ser.done) { nextMap(); E.runMap(L.sim); L.evIdx = Math.max(0, L.sim.events.length - 9); L.feed = []; pumpEvents(); E.recordMap(S, L.ser, L.sim); }
    L.phase = "end"; renderMatch();
  },
  leave: () => { const ser = ui.match.ser; ui.match = null; doAdvance(ser); },
};

/* ---------- Démarrage ---------- */
function start(data) {
  if (data && data.S) S = data.S; else S = loadSave();
  render();
}
if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
