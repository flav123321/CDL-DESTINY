:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Concept : un écran de régie de tournoi. Une piste de saison en haut, la décision au centre, les chiffres sur le côté. Thème sombre unique, assumé. */
:root{
  color-scheme:dark;
  --bg:#0d1619; --panel:#142127; --panel2:#1b2b32; --line:#2c3f47;
  --fg:#eaf0f1; --dim:#93a7ae; --accent:#f5a524; --accent-ink:#1b1204;
  --win:#55d394; --loss:#ff7a6b;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.5 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
#app{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.dim{color:var(--dim)}
.fic{color:var(--dim);font-size:.8em}

/* Barre du haut */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;border-bottom:1px solid var(--line);padding-bottom:12px}
.ovr{font:900 58px/.85 var(--display);color:var(--accent)}
.who{min-width:0;flex:1 1 200px}
.who h1{font-size:30px;overflow-wrap:anywhere}
.wrank{color:var(--accent);font-size:.8em}
table.palm tfoot td{font-weight:700;border-top:1px solid var(--accent);border-bottom:0}
table.palm th:first-child,table.palm td:first-child{width:auto}
.nums{display:flex;flex-wrap:wrap;gap:6px 20px}

nav{display:flex;gap:2px;overflow-x:auto}
nav button{padding:8px 13px;font:800 19px/1 var(--display);color:var(--dim);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current=true]{color:var(--fg);border-color:var(--accent)}

/* Piste de saison */
.track{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.tick{height:34px;background:var(--panel);display:grid;place-items:center;font:600 10px/1 var(--mono);color:var(--dim);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,0 100%,7px 50%);padding-inline:9px 7px;text-align:center}
.tick.done{background:var(--panel2);color:var(--fg)}
.tick.now{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tick.skip{opacity:.4;text-decoration:line-through}
@media(max-width:640px){nav button{padding:8px 6px;font-size:15.5px}.tick{font-size:0}.tick::after{content:attr(data-s);font-size:10px}.tick{height:26px}}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.cols>*{min-width:0}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}

/* Décision */
.scene h2{font-size:clamp(32px,6vw,46px);font-weight:900;margin-block:4px 8px}
.scene>p{max-width:62ch}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:block;width:100%;padding:13px 16px;background:var(--panel);border-left:3px solid var(--line);transition:background .12s,border-color .12s}
.opt:hover{background:var(--panel2);border-left-color:var(--accent)}
.opt strong{display:block;font-weight:600;font-size:17px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font:500 12px/1.4 var(--mono)}
.up{color:var(--win)}.down{color:var(--loss)}.neutral{color:var(--accent)}

/* Résultat d'événement */
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;background:var(--panel);padding:13px 16px}
.ev .rank{grid-row:span 2;font:900 54px/.9 var(--display);color:var(--fg)}
.ev.gold .rank{color:var(--accent)}
.ev h3{font-size:23px}
.runs{display:flex;flex-direction:column;gap:1px;font:400 13px/1.45 var(--mono)}
.flash{font-size:15px;padding-left:12px;border-left:3px solid var(--line);max-width:68ch}
.flash.ok{border-color:var(--win)}.flash.bad{border-color:var(--loss)}.flash.note{border-color:var(--accent)}
.news{background:var(--panel);padding:11px 16px;font-size:14px}
.news ul{margin:5px 0 0;padding-left:18px}

/* Colonne */
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:14px;margin-top:6px}
.bar i{display:block;height:7px;background:var(--panel2)}
.bar i span{display:block;height:100%;background:var(--accent)}
.bar i span.soft{background:var(--dim)}
.bar .mono{text-align:right;font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--panel2);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:left;color:var(--dim);width:24px}
tr.mine td{background:var(--panel2);color:var(--accent);font-weight:600}
tr.cut td{border-bottom-color:var(--accent)}
.feed{list-style:none;margin:6px 0 0;padding:0;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.feed li{padding-left:10px;border-left:2px solid var(--line)}
.feed time{font:400 11px var(--mono);color:var(--dim);display:block}
.scroll{overflow-x:auto}

/* Offres et équipes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:10px}
.card{background:var(--panel);padding:13px 15px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h3{font-size:25px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 span{font-size:22px;color:var(--accent)}
.card.me{outline:1px solid var(--accent)}
.card h3.tband{margin:-13px -15px 4px;padding:9px 15px;align-items:center}
.card h3.tband span{color:inherit}
.dot{display:inline-block;width:10px;height:10px;margin-right:7px;vertical-align:baseline;flex:none}
.card ol{list-style:none;margin:0;padding:0;font-size:14.5px}
.card ol li{display:flex;justify-content:space-between;gap:8px;padding-block:2px}
.card ol li.me{color:var(--accent);font-weight:600}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);font:800 21px/1 var(--display);padding:11px 18px;text-align:center;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn:hover{filter:brightness(1.1)}
.ghost{color:var(--dim);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.ghost:hover{color:var(--fg)}
.offer{cursor:pointer;width:100%;border-left:3px solid var(--line);transition:background .12s,border-color .12s}
.offer:hover{background:var(--panel2);border-left-color:var(--accent)}
.offer.keep{border-left-color:var(--accent);background:var(--panel2);max-width:460px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv span:last-child{font-family:var(--mono);font-size:13px;text-align:right}
.tiles{display:flex;flex-wrap:wrap;gap:8px 26px;background:var(--panel);padding:12px 16px}
.tiles b{display:block;font:800 30px/1 var(--display)}

/* Création */
.hero{padding-block:16px 2px}
.hero h1{font-size:clamp(62px,14vw,136px);font-weight:900;color:var(--accent);line-height:.84}
.hero p{max-width:60ch;margin-top:12px;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],select{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:11px 12px;font:600 17px var(--body);width:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:520px){.two{grid-template-columns:minmax(0,1fr)}}

.pick{padding:11px 13px;background:var(--panel);border-left:3px solid var(--line);font-size:13.5px;color:var(--dim)}
.pick strong{display:block;color:var(--fg);font-size:16px;font-weight:600;line-height:1.25;margin-bottom:2px}

textarea{width:100%;min-height:110px;background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:10px;font:400 13px/1.4 var(--mono)}
.conf{background:var(--panel);padding:12px 15px;display:flex;flex-direction:column;gap:6px;font-size:14px;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.btn2{background:var(--panel2);padding:9px 13px;font-weight:600;font-size:15px}
.btn2:hover{background:var(--line)}
.fine{font-size:13px;color:var(--dim);max-width:75ch}
section{min-width:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

rm":2,"morale":2}},{"id":"c","label":"Tester les deux jusqu'à la reprise","effects":{"aim":1,"move":1,"mental":-1}}]},{"id":"prep-discussion-avec-le-capitaine","pool":"prep","title":"Discussion avec le capitaine","text":"Il veut savoir ce que tu attends de la saison. Et ce que l'équipe peut attendre de toi.","options":[{"id":"a","label":"Annoncer que tu veux être le meilleur de l'équipe","effects":{"fame":3,"chem":-3,"morale":3}},{"id":"b","label":"Dire que tu feras ce qu'il faut pour gagner","effects":{"chem":7}},{"id":"c","label":"Lui demander ce qu'il voit, lui, comme axe de progrès","effects":{"sense":2,"chem":3}}]},{"id":"train-scrims-contre-le-leader","pool":"train","title":"Scrims contre le leader","text":"L'équipe du haut de tableau accepte une session contre vous. Ils ne vous feront aucun cadeau.","options":[{"id":"a","label":"Jouer à fond et encaisser","effects":{"mental":2,"sense":2,"morale":-3}},{"id":"b","label":"Tester des strats sans se dévoiler","effects":{"sense":2,"chem":2}},{"id":"c","label":"Garder tes meilleurs plans pour le Major","effects":{"form":2,"fame":-1}}]},{"id":"train-le-carnet-de-notes","pool":"train","title":"Le carnet de notes","text":"Un joueur vétéran conseille de noter chaque erreur après chaque partie. Ça prend une heure par soir.","options":[{"id":"a","label":"Le faire tous les soirs","effects":{"sense":3,"mental":1,"morale":-2}},{"id":"b","label":"Le faire seulement après les défaites","effects":{"sense":2,"morale":-1}},{"id":"c","label":"Laisser ça au staff","effects":{"morale":3}}]},{"id":"train-routine-du-matin","pool":"train","title":"Routine du matin","text":"Le préparateur te propose de te lever à 8 h et de t'échauffer 30 minutes avant de jouer.","options":[{"id":"a","label":"Tenir le programme","effects":{"form":2,"mental":2,"morale":-2}},{"id":"b","label":"L'adapter à ton rythme","effects":{"form":1,"morale":2}},{"id":"c","label":"Refuser : tu joues mieux la nuit","effects":{"aim":1,"chem":-2}}]},{"id":"train-echange-d abel":"Rester sympa et prudent","effects":{"fame":4,"morale":1}},{"id":"c","label":"Décliner","effects":{"form":1,"fame":-1}}]},{"id":"off-ton-maillot-en-boutique","pool":"off","title":"Ton maillot en boutique","text":"L'équipe veut lancer une collection à ton nom. Il faut poser pour les photos en pleine semaine de scrims.","options":[{"id":"a","label":"Accepter, c'est un rêve de gosse","effects":{"fame":6,"money":8000,"morale":5,"form":-1}},{"id":"b","label":"Accepter, mais après le Major","effects":{"fame":3,"money":3000}},{"id":"c","label":"Refuser, tu n'as encore rien gagné","effects":{"mental":2,"chem":2}}]},{"id":"off-le-pote-d-avant","pool":"off","title":"Le pote d'avant","text":"Un ami de tes débuts est en galère. Il te demande de le faire venir dans ton entourage.","options":[{"id":"a","label":"L'aider et lui trouver une place","effects":{"morale":7,"money":-4000,"form":-1}},{"id":"b","label":"Lui prêter un peu d'argent","effects":{"morale":3,"money":-2000}},{"id":"c","label":"Lui expliquer que ce n'est pas le moment","effects":{"form":1,"morale":-3}}]},{"id":"off-offre-de-createur","pool":"off","title":"Offre de créateur","text":"Une agence propose de gérer tes réseaux, contre un bon pourcentage.","options":[{"id":"a","label":"Signer et laisser l'agence travailler","effects":{"fame":7,"money":-3000}},{"id":"b","label":"Gérer tes réseaux toi-même","effects":{"fame":3,"form":-1,"money":2000}},{"id":"c","label":"Poster moins et te concentrer","effects":{"form":2,"fame":-2}}]},{"id":"off-soiree-apres-le-major","pool":"off","title":"Soirée après le Major","text":"Tout le monde sort fêter la fin du week-end. Le vol retour est tôt demain.","options":[{"id":"a","label":"Sortir avec l'équipe jusqu'au bout","effects":{"chem":7,"morale":5,"form":-2}},{"id":"b","label":"Passer une heure et rentrer","effects":{"chem":3,"morale":2}},{"id":"c","label":"Rester à l'hôtel et dormir","effects":{"form":2,"chem":-2}}]},{"id":"off-le-fan-qui-t-ecrit","pool":"off","title":"Le fan qui t'écrit","text":"Un jeune fan t'envoie un long message : il joue grâce à toi, et il traverse une période difficile.","options":[{"id":"a","label":"Prendre le temps de lui répondre","effects":{"morale":6,"fame":2}},{"id":"b","label":"Lui envoyer ton maillot signé","effects":{"morale":4,"fame":3,"money":-500}},{"id":"c","label":"Partager un message pour tous tes fans","effects":{"fame":4}}]},{"id":"off-l-interview-qui-derape","pool":"off","title":"L'interview qui dérape","text":"Un journaliste coupe ta phrase. Le titre laisse entendre que tu critiques ton coach.","options":[{"id":"a","label":"Publier une mise au point","effects":{"chem":4,"fame":2}},{"id":"b","label":"Aller voir le coach directement","effects":{"chem":7,"morale":-1}},{"id":"c","label":"Laisser passer la tempête","effects":{"mental":2,"chem":-4}}]},{"id":"off-vie-a-deux","pool":"off","title":"Vie à deux","text":"Ta vie perso prend de la place, et les longues soirées de scrims commencent à peser.","options":[{"id":"a","label":"Poser des horaires clairs","effects":{"morale":8,"form":1,"sense":-1}},{"id":"b","label":"Tout donner au jeu cette saison","effects":{"aim":2,"morale":-6}},{"id":"c","label":"En parler et trouver un compromis","effects":{"morale":4,"mental":1}}]},{"id":"off-investir-tes-gains","pool":"off","title":"Investir tes gains","text":"Un conseiller te présente plusieurs options pour ton argent. L'une a l'air trop belle.","options":[{"id":"a","label":"Placer une partie à long terme","effects":{"money":-5000,"mental":2}},{"id":"b","label":"Tenter le coup risqué","effects":{"money":12000,"morale":-4,"form":-1}},{"id":"c","label":"Tout garder de côté pour le moment","effects":{"money":2000}}]},{"id":"off-tournoi-caritatif","pool":"off","title":"Tournoi caritatif","text":"Une grosse association monte un tournoi en ligne avec des pros et des créateurs.","options":[{"id":"a","label":"Jouer et animer le stream","effects":{"fame":6,"morale":4,"form":-1}},{"id":"b","label":"Faire un don et res La place de chouchou","text":"Le coach veut bâtir l'équipe autour de toi. Les autres risquent de le prendre mal.","options":[{"id":"a","label":"Accepter et assumer","effects":{"fame":4,"morale":4,"chem":-6}},{"id":"b","label":"Demander que ça reste collectif","effects":{"chem":6,"morale":1}},{"id":"c","label":"Accepter, et aider les autres à s'y retrouver","effects":{"sense":1,"chem":1,"morale":2}}]},{"id":"clutch-le-rush-surprise","pool":"clutch","title":"Le rush surprise","text":"S&D, tu défends seul le site B. Tu entends trois paires de pas arriver très vite.","options":[{"id":"a","label":"Tenir l'angle et prendre le premier","stat":"aim","difficulty":-0.05,"impact":2.5,"win":"Tu les prends un par un dans la porte. Le chat explose.","lose":"Trop nombreux, trop rapides. Le site tombe."},{"id":"b","label":"Reculer et attendre la pose","stat":"sense","difficulty":0.02,"impact":2,"win":"Tu les laisses poser, puis tu nettoies tout en silence.","lose":"Ils couvrent mieux que prévu et tu tombes en essayant de revenir."},{"id":"c","label":"Lancer tout ton matos et bouger","stat":"move","difficulty":-0.08,"impact":2.5,"win":"Tu sèmes le chaos assez longtemps pour que l'aide arrive.","lose":"Ton matos ne touche personne, et tu te retrouves à découvert."}]},{"id":"clutch-le-spawn-qui-bascule","pool":"clutch","title":"Le spawn qui bascule","text":"Hardpoint. Vous contrôlez le spawn, mais deux adversaires viennent de passer derrière vous.","options":[{"id":"a","label":"Retourner les chercher","stat":"aim","difficulty":0,"impact":2,"win":"Tu les coupes net, et le spawn reste à vous.","lose":"Tu les rates et l'équipe se fait prendre en sandwich."},{"id":"b","label":"Rester sur la zone et jouer le score","stat":"mental","difficulty":0.05,"impact":1.5,"win":"Vous gardez le sang-froid, et les points tombent.","lose":"Le spawn casse et vous perdez la moitié de votre avance."},{"id":"c","label":"Annoncer un repli complet vers la zone suivante","stat":"sense","difficulty":-0.03,"impa function series(a,b,to,str){let x=0,y=0;const p=1/(1+Math.exp(-(str.get(a)-str.get(b))/RULES.simulation.mapSpread));while(x<to&&y<to){Math.random()<p?x++:y++}return{a,b,x,y,win:x>y?a:b,lose:x>y?b:a}}

 let ts=league(lg);

 let qw=0,ql=0;
 if(!champs){for(let r=0;r<RULES.format.qualifierRounds;r++){const o=shuffle(ts);for(let i=0;i+1<o.length;i+=2){const s=series(o[i].id,o[i+1].id,RULES.format.seriesFirstTo,str);const W=team(s.win),L=team(s.lose);W.w++;L.l++;W.pts+=RULES.format.qualifierWinPoints;if(s.win===S.teamId)qw++;if(s.lose===S.teamId)ql++}}}

 order.forEach((id,i)=>{if(!champs)team(id).pts+=pts[i]||0});

}

function pickScene(pool,key){S.used=S.used||{};const u=S.used[key]||[];let av=pool.filter(s=>!u.includes(s.id));if(!av.length){S.used[key]=[];av=pool}const s=pick(av);S.used[key]=(S.used[key]||[]).concat(s.id);return{pool:key,id:s.id}}

 shuffle(bot).slice(0,2).forEach(t=>{if(t.p.length<2)return;const w=t.p.slice().sort((a,b)=>a.r-b.r)[0];t.p=t.p.filter(p=>p!==w);S.fa.push(w);news.push(`${t.n} libère ${w.n}.`)});
 const top=ranks.slice(0,6).filter(t=>t.id!==S.teamId);const rich=pick(top);const sell=pick(ranks.slice(4).filter(t=>t.id!==S.teamId&&t!==rich));
 if(rich&&sell&&sell.p.length){const star=sell.p.slice().sort((a,b)=>b.r-a.r)[0],w=rich.p.slice().sort((a,b)=>a.r-b.r)[0];if(star.r>w.r){sell.p=sell.p.filter(p=>p!==star);rich.p=rich.p.filter(p=>p!==w);rich.p.push(star);sell.p.push(w);news.push(`Échange : ${star.n} part chez ${rich.n}, ${w.n} chez ${sell.n}.`)}}
 S.teams.filter(t=>t.lg==="CDL").forEach(t=>fillTeam(t,news));

}

function readKV(k,native){let a=null;try{a=parseJ(localStorage.getItem(k))}catch(e){}const b=parseJ(native);if(a&&b)return(b.ts||0)>(a.ts||0)?b:a;return a||b}
function writeKV(k,o){o.ts=Date.now();const v=JSON.stringify(o);try{localStorage.setItem(k,v)}catch(e){}

function freshCS(){return{base:DEFAULT_CONTENT,active:DEFAULT_CONTENT,local:null,pending:null,conflicts:[],url:null,lastCheck:null}}
function computePending(remote){
 let merged=remote,conflicts=[];
 if(CS.local){const m=merge3(CS.base,CS.local,remote);if(validateContent(m.merged).ok){merged=m.merged;conflicts=m.conflicts}
  else updMsg="Tes modifications locales ne sont plus compatibles avec la version en ligne : elles sont mises de côté."}

}
/** Reçoit une version complète. Elle est validée, fusionnée, puis appliquée au prochain moment sûr. */
function receive(remote){
 const v=validateContent(remote);
 if(!v.ok)return{ok:false,msg:"Fichier refusé, ton jeu n'a pas changé : "+v.errors[0]};
 const known=CS.pending?CS.pending.remote.revision:CS.base.revision;
 if(remote.revision<=known)return{ok:true,msg:CS.pending?`La révision ${known} est déjà reçue. Elle s'appliquera à la prochaine saison.`:`Tu es à jour (révision ${known}).`};
 CS.pending=computePending(remote);saveCS();
 if(!S||atSeasonStart()){const n=applyPending();return{ok:true,msg:`Révision ${CS.active.revision} appliquée. ${n}`,applied:true}}
 return{ok:true,msg:`Révision ${remote.revision} reçue. Elle s'appliquera au début de ta prochaine saison, pour ne pas changer les règles en cours de route.`};
}
function applyPending(){
 const p=CS.pending;if(!p)return null;
 CS.base=p.remote;CS.active=p.merged;CS.local=CS.local?p.merged:null;CS.conflicts=p.conflicts;CS.pending=null;
 hydrate(CS.active);saveCS();

}
function contentUrl(){return CS.url||(BR&&BR.contentUrl)||(/^https?:/.test(location.protocol)&&!BR?"content.json":null)}

 if(!url){if(manual){updMsg="Ajoute d'abord l'adresse de ton fichier content.json.";render()}return}
 if(navigator.onLine===false){if(manual){updMsg=`Pas de réseau. Tu continues à jouer avec la révision ${CS.active.revision}.`;render()}return}
 if(checking)return;checking=true;
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);
 try{
  const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ctl.signal});
  if(!r.ok)throw new Error("Le serveur a répondu "+r.status+".");
  const remote=JSON.parse(await r.text());
  CS.lastCheck=Date.now();
  const res=receive(remote);saveCS();updMsg=res.msg;
  if(manual||tab==="maj"||res.applied){if(!S)keepForm();render()}
 }catch(e){CS.lastCheck=Date.now();if(manual){updMsg="Vérification impossible, ton jeu continue normalement. "+(e.name==="AbortError"?"Le serveur a mis trop de temps à répondre.":e instanceof SyntaxError?"Le fichier n'est pas du JSON valide.":e.message);render()}}

}

 const next=applyPatch(CS.active,o),v=validateContent(next);
 if(!v.ok)return"Modification refusée, rien n'a changé : "+v.errors[0];
 CS.local=next;CS.active=next;hydrate(next);
 if(CS.pending)CS.pending=computePending(CS.pending.remote);
 saveCS();return"Modification locale enregistrée. Elle sera conservée lors des prochaines mises à jour.";
}
function resolveConflict(i,mine){
 const c=CS.conflicts[i];if(!c)return;
 if(mine){const a=setPath(CS.active,c.path,c.ours);
  if(!validateContent(a).ok){updMsg="Ta version n'est plus compatible avec ce contenu, la version en ligne est conservée."}
  else{CS.active=a;CS.local=setPath(CS.local||CS.base,c.path,c.ours);hydrate(a);updMsg="Ta version est conservée."}}
 else updMsg="La version en ligne est conservée.";
 CS.conflicts.splice(i,1);saveCS();render();
}
function handleUpd(d,b){

  <div class="kv"><span class="dim">Coéquipiers</span><span>Repart à ${RULES.retention.newTeamChem}</span></div>
 </button>`};
 const keepBlock=r=>{const n=esc(r.teamN);
  if(!stay)return`<div class="flash bad">${n} ne te garde pas : K/D ${fr(r.kd,2)} et ${ord(r.place)} place, ça n'a pas suffi. Il faut trouver un autre club.</div>`;
  const raise=stay.sal>S.salary?Math.round((stay.sal/S.salary-1)*100):0;
  return`<button class="card offer keep" data-sign="${stay.id}" id="sign-${stay.id}">
   ${tBand(stay.id,"Rester chez "+n,Math.round(stay.str))}
   <p>${r.keep==="fort"?"Le club veut absolument te garder et augmente ton salaire.":"Le club est satisfait de ta saison et te propose de prolonger."}</p>
   <div class="kv"><span class="dim">Salaire</span><span>${usd(stay.sal)}${raise?" (+"+raise+" %)":""}</span></div>
   <div class="kv"><span class="dim">Coéquipiers</span><span class="up">+${RULES.retention.stayChem}</span></div>
   <div class="kv"><span class="dim">Moral</span><span class="up">+${RULES.retention.stayMorale}</span></div>
   <div class="kv"><span class="dim">Au club depuis</span><span>${S.clubYears||1} saison${(S.clubYears||1)>1?"s":""}</span></div>
  </button>`};
 const bigM=r.lg==="CDL"?r.place<=4:r.place<=2;
 const judge=r.v>=88?"Tout le monde veut te signer.":r.v>=80?"Ta cote monte fort, les grosses équipes regardent.":r.lg==="CH"?(S.offers.some(o=>team(o.id).lg==="CDL")?"La CDL t'ouvre enfin la porte.":"La CDL reste loin. Il faut une saison de plus."):r.v>=74?"Tu as ta place dans la ligue. Reste à la confirmer.":"Saison difficile. Peu d'équipes t'appellent.";
 return`<section class="scene">
  <div class="lab">Dernière décision · Mercato ${S.year}</div>
  <h2>${esc(r.teamN)} finit ${ord(r.place)}</h2>
  <p>${judge}${r.awards.length?` <strong style="color:var(--accent)">${r.awards.join(", ")} !</strong>`:""}</p>
 </section>
 <div class="tiles">
  <div><b>${fr(r.kd,2)}</b><span class="lab">K/D</span></div>
  <div><b>${r.pts}</b><span class="lab">Points équipe</span></div>
  <div><b>${d>=0?"+":"−"}${fr(Math.abs(d),1)}</b><span class="lab">Note</span></div>
  <div><b>${Math.round(r.v)}</b><span class="lab">Cote marché</span></div>
  <div><b>${usd(r.earn)}</b><span class="lab">Gains saison</span></div>
 </div>
 <section class="stack" style="gap:8px"><div class="lab">Ton équipe pour ${S.year+1}</div>
 ${keepBlock(r)}
 ${others.length?`<div class="lab" style="margin-top:6px">${stay?"Ou pars ailleurs":"Tes offres"}</div><div class="grid">${others.map(offerCard).join("")}</div>`:`<p class="dim">Aucune autre équipe ne t'appelle cette année.</p>`}</section>
 <div>${ui.confirm==="retire"?`<span>Arrêter pour de bon ? </span><button class="ghost" data-act="retire">Oui, je prends ma retraite</button> · <button class="ghost" data-act="cancel">Non</button>`:`<button class="ghost" data-act="ask-retire">Prendre ma retraite</button>`}</div>`;
}

 const m=S.me,a=m.attrs,t=myTeam();
 const table=league(t.lg).slice().sort((x,y)=>y.pts-x.pts);
 const cutN=RULES.qualifiers[t.lg];

 </section>
 <section><div class="lab">Journal</div><ul class="feed">${S.log.slice(0,6).map(l=>`<li><time>${l.y}</time>${esc(l.s)}</li>`).join("")}</ul></section>

function carriereView(){
 return`<div class="cols"><div class="stack">${track()}${evCard(S.ev)}${flashes()}${newsBox()}${S.step>=9?reviewView():decisionView()}</div>${sidePanel()}</div>${footerCareer()}`;
}
/* Classement mondial : note du joueur, ajustée par ses performances de la saison. */
function worldRanking(){
 const score=(r,k,n,lg)=>r+(n?(k-1)*(lg==="CDL"?25:12):0);
 const list=S.teams.flatMap(t=>t.p.map(p=>({n:p.n,f:p.f,t:t.n,id:t.id,kd:p.kn?kd(p):null,s:score(p.r,kd(p),p.kn,t.lg)})));
 const mt=myTeam();
 list.push({n:S.me.name,t:mt.n,id:mt.id,me:true,kd:S.me.kn?kd(S.me):null,s:score(ovr(),kd(S.me),S.me.kn,mt.lg)});
 return list.sort((a,b)=>b.s-a.s);
}
const myRank=()=>worldRanking().findIndex(p=>p.me)+1;
function seasonRecord(evs){
 let w=0,l=0,ch=0,maj=0;
 (evs||[]).filter(e=>e.run).forEach(e=>{
  if(e.run.qual){const[a,b]=e.run.qual.split("-").map(Number);w+=a;l+=b}
  e.run.series.forEach(x=>{x.w>x.l?w++:l++});
  if(e.lg==="CDL"&&e.run.rank===1){if(e.champs)ch++;else maj++}
 });
 return{w,l,ch,maj};
}
function palmaresView(){
 const m=S.me,rows=m.career.map(c=>{
  const y=String(c.y),tr=m.trophies.filter(t=>t.t.endsWith(" "+y));
  return{y:c.y,t:c.t,w:c.w,l:c.l,ch:c.ch!==undefined?c.ch:tr.filter(t=>/^Champion Champs /.test(t.t)).length,maj:c.maj!==undefined?c.maj:tr.filter(t=>/^Vainqueur Major /.test(t.t)).length,rank:c.rank}});
 if(!S.review&&S.seasonEvents.some(e=>e.run)){const r=seasonRecord(S.seasonEvents);rows.push({y:S.year,t:myTeam().n,now:true,rank:myRank(),...r})}
 const sum=k=>rows.reduce((a,c)=>a+(c[k]||0),0),old=rows.some(c=>c.w===undefined);
 const ranks=rows.map(c=>c.rank).filter(Boolean).concat(m.bestRank||[]),best=ranks.length?Math.min(...ranks):myRank();
 return`<div class="stack"><h2 style="font-size:38px">Palmarès</h2>
 <div class="tiles"><div><b>${sum("w")}</b><span class="lab">Victoires</span></div><div><b>${sum("l")}</b><span class="lab">Défaites</span></div><div><b>${sum("ch")}</b><span class="lab">Titres Champs</span></div><div><b>${sum("maj")}</b><span class="lab">Majors gagnés</span></div><div><b>#${myRank()}</b><span class="lab">Rang mondial</span></div><div><b>#${best}</b><span class="lab">Meilleur rang</span></div></div>
 <section class="scroll"><div class="lab">Saison par saison</div>${rows.length?`<table class="palm" style="margin-top:4px"><thead><tr><th>An</th><th>Équipe</th><th>V</th><th>D</th><th>Champs</th><th>Majors</th><th>Rang</th></tr></thead><tbody>${rows.slice().reverse().map(c=>`<tr class="${c.now?"mine":""}"><td>${c.y}</td><td>${esc(c.t)}${c.now?' <span class="fic">en cours</span>':""}</td><td>${c.w===undefined?"–":c.w}</td><td>${c.l===undefined?"–":c.l}</td><td>${c.ch}</td><td>${c.maj}</td><td>${c.rank?"#"+c.rank:"–"}</td></tr>`).join("")}</tbody><tfoot><tr><td></td><td>Total</td><td>${sum("w")}</td><td>${sum("l")}</td><td>${sum("ch")}</td><td>${sum("maj")}</td><td></td></tr></tfoot></table>`:'<p class="dim" style="margin-top:4px">Ta première ligne arrive après ton premier tournoi.</p>'}
 <p class="fine" style="margin-top:6px">V et D comptent les séries jouées avec ton équipe, qualifications comprises. Majors et Champs comptent les titres en CDL.${old?" Les saisons jouées avant cette mise à jour n'ont pas de V et D.":""}</p></section>
 <section><div class="lab">Trophées</div><div style="margin-top:4px;font-size:15px">${m.trophies.length?m.trophies.slice().reverse().map(x=>`<div>${x.big?"<strong>":""}${esc(x.t)}${x.big?"</strong>":""}</div>`).join(""):'<span class="dim">Rien encore. Le premier trophée changera tout.</span>'}</div></section>
 </div>`;
}
function footerCareer(){
 const m=S.me;
 return`<section class="stack" style="border-top:1px solid var(--line);padding-top:14px">
 <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
 <div class="scroll"><div class="lab">Parcours</div>${m.career.length?`<table style="margin-top:4px"><thead><tr><th>An</th><th>Équipe</th><th>Place</th><th>K/D</th><th>Note</th></tr></thead><tbody>${m.career.slice().reverse().slice(0,10).map(c=>`<tr><td>${c.y}</td><td>${esc(c.t)}</td><td>${ord(c.place)}</td><td>${fr(c.kd,2)}</td><td>${Math.round(c.ovr)}</td></tr>`).join("")}</tbody></table>`:'<div class="dim" style="font-size:15px;margin-top:4px">Ta première saison s\'écrit maintenant.</div>'}</div>
 </div>
 <div>${ui.confirm==="reset"?`<span>Effacer cette carrière ? </span><button class="ghost" data-act="reset">Oui, recommencer</button> · <button class="ghost" data-act="cancel">Non</button>`:`<button class="ghost" data-act="ask-reset">Nouvelle carrière</button>`}</div>
 </section>`;
}
function equipesView(){
 const card=t=>`<div class="card ${t.id===S.teamId?"me":""}">${tBand(t.id,t.n,Math.round(teamStr(t,false)))}<ol>${rosterSorted(t).map(p=>`<li class="${p.me?"me":""}"><span>${esc(p.n)}${p.f?' <span class="fic">fictif</span>':""}</span><span class="mono">${Math.round(p.r)}</span></li>`).join("")}</ol></div>`;
 const fa=S.fa.slice().sort((a,b)=>b.r-a.r).slice(0,8);
 return`<div class="stack"><section><h2 style="font-size:34px;margin-bottom:8px">CDL</h2><div class="grid">${league("CDL").slice().sort((a,b)=>teamStr(b,false)-teamStr(a,false)).map(card).join("")}</div></section>
 <section><h2 style="font-size:34px;margin-bottom:8px">Challengers</h2><div class="grid">${league("CH").map(card).join("")}</div></section>
 ${fa.length?`<section><div class="lab">Sans équipe</div><div style="margin-top:4px">${fa.map(p=>esc(p.n)+" ("+Math.round(p.r)+")").join(" · ")}</div></section>`:""}
 <p class="fine">Les notes sont mes estimations pour le jeu, pas des chiffres officiels. Les effectifs viennent des listes publiées fin octobre 2026. Ils évoluent ensuite selon la simulation, sans rapport avec la réalité.</p></div>`;
}

 const lg=myTeam().lg;
 const ev=S.seasonEvents.filter(e=>e.run);
 const winners=S.seasonEvents.filter(e=>e.lg==="CDL");
 return`<div class="stack"><h2 style="font-size:34px">Saison ${S.year}</h2>
 ${ev.length?ev.slice().reverse().map(evCard).join(""):'<p class="dim">Pas encore de tournoi joué cette saison. Le premier arrive après ta prochaine décision.</p>'}
 ${winners.length?`<section><div class="lab">Vainqueurs CDL</div><div style="margin-top:4px">${winners.map(e=>`<div class="kv" style="max-width:420px"><span>${esc(e.label)}</span><span>${team(e.win)?team(e.win).n:""}</span></div>`).join("")}</div></section>`:""}
 ${S.champsHist.length?`<section><div class="lab">Champions du monde</div><div style="margin-top:4px">${S.champsHist.slice(0,12).map(c=>`<div class="kv" style="max-width:420px"><span>${c.y}</span><span>${esc(c.t)}</span></div>`).join("")}</div></section>`:""}
 </div>`;
}
function classementView(){
 const lg=myTeam().lg;
 const pls=league("CDL").concat(lg==="CH"?[]:[]).flatMap(t=>t.p.map(p=>({n:p.n,f:p.f,t:t.n,kd:kd(p)})));
 if(lg==="CDL"&&S.me.kn)pls.push({n:S.me.name,t:myTeam().n,kd:kd(S.me),me:true});
 pls.sort((a,b)=>b.kd-a.kd);
 const tb=l=>l.slice().sort((a,b)=>b.pts-a.pts);
 return`<div class="stack"><div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
 <section class="scroll"><h2 style="font-size:34px;margin-bottom:6px">Équipes CDL</h2><table><thead><tr><th>#</th><th>Équipe</th><th>V-D</th><th>Pts</th></tr></thead><tbody>${tb(league("CDL")).map((t,i)=>`<tr class="${t.id===S.teamId?"mine":""} ${i===RULES.qualifiers.CDL-1?"cut":""}"><td>${i+1}</td><td>${tDot(t.id)}${t.n}</td><td>${t.w}-${t.l}</td><td>${t.pts}</td></tr>`).join("")}</tbody></table><p class="fine" style="margin-top:6px">Le trait marque la qualification pour Champs (${RULES.qualifiers.CDL} premiers).</p></section>
 <section class="scroll"><h2 style="font-size:34px;margin-bottom:6px">Classement mondial</h2>${(()=>{const all=worldRanking(),i=all.findIndex(p=>p.me),top=all.slice(0,10).map((p,x)=>[p,x+1]);if(i>=10)top.push([all[i],i+1]);return`<table><thead><tr><th>#</th><th>Joueur</th><th>Équipe</th></tr></thead><tbody>${top.map(([p,r])=>`<tr class="${p.me?"mine":""}"><td>${r}</td><td>${esc(p.n)}</td><td style="text-align:left">${tDot(p.id)}${esc(p.t)}</td></tr>`).join("")}</tbody></table>`})()}</section>
 <section class="scroll"><h2 style="font-size:34px;margin-bottom:6px">Top K/D CDL</h2>${S.seasonEvents.length?`<table><thead><tr><th>#</th><th>Joueur</th><th>Équipe</th><th>K/D</th></tr></thead><tbody>${pls.slice(0,12).map((p,i)=>`<tr class="${p.me?"mine":""}"><td>${i+1}</td><td>${esc(p.n)}</td><td style="text-align:left">${esc(p.t)}</td><td>${fr(p.kd,2)}</td></tr>`).join("")}</tbody></table>`:'<p class="dim">Les K/D arrivent après le premier Major.</p>'}</section>
 </div>
 <section class="scroll"><h2 style="font-size:34px;margin-bottom:6px">Challengers</h2><table style="max-width:520px"><thead><tr><th>#</th><th>Équipe</th><th>V-D</th><th>Pts</th></tr></thead><tbody>${tb(league("CH")).map((t,i)=>`<tr class="${t.id===S.teamId?"mine":""} ${i===RULES.qualifiers.CH-1?"cut":""}"><td>${i+1}</td><td>${tDot(t.id)}${t.n}</td><td>${t.w}-${t.l}</td><td>${t.pts}</td></tr>`).join("")}</tbody></table></section></div>`;
}
function endView(){
 const m=S.me,wins=m.trophies.filter(t=>/^Champion Champs/.test(t.t)).length,maj=m.trophies.filter(t=>/^Vainqueur Major/.test(t.t)).length,mvp=m.trophies.filter(t=>/^MVP/.test(t.t)).length;
 const score=wins*30+maj*8+mvp*12+(m.best-60)*.8+m.career.length*1.5;
 const lab=score>=120?"Légende de la CDL":score>=70?"Grand nom de la ligue":score>=35?"Pro respecté":"Carrière honnête";
 return`<div class="stack"><div class="hero"><div class="lab">Fin de carrière · ${m.age} ans</div><h1 style="font-size:clamp(46px,10vw,96px)">${esc(m.name)}</h1><p><strong style="color:var(--accent)">${lab}</strong>. ${m.career.length} saison${m.career.length>1?"s":""}, ${usd(m.money)} gagnés (fictifs).</p></div>
 <div class="tiles"><div><b>${wins}</b><span class="lab">Titres Champs</span></div><div><b>${maj}</b><span class="lab">Majors</span></div><div><b>${mvp}</b><span class="lab">MVP</span></div><div><b>${Math.round(m.best)}</b><span class="lab">Meilleure note</span></div></div>
 <div class="scroll"><table><thead><tr><th>An</th><th>Équipe</th><th>Place</th><th>K/D</th><th>Note</th></tr></thead><tbody>${m.career.map(c=>`<tr><td>${c.y}</td><td>${esc(c.t)}</td><td>${ord(c.place)} ${lgName(c.lg)}</td><td>${fr(c.kd,2)}</td><td>${Math.round(c.ovr)}</td></tr>`).join("")}</tbody></table></div>
 <div><button class="btn" data-act="reset" id="restart">Nouvelle carrière</button></div></div>`;
}
function createView(){
 const f=form,starters=STARTERS;if(!starters.some(s=>s[0]===f.team))f.team=starters[0][0];if(!ROLES[f.role])f.role=Object.keys(ROLES)[0];if(!ORIG[f.orig])f.orig=Object.keys(ORIG)[0];
 return`<div class="hero"><h1>CDL Destiny</h1><p>Tu débutes en Challengers à 18 ans. Chaque saison tient en dix décisions maximum, et ton choix d'équipe dépend de ce que tu as montré. Jusqu'où tu montes ?</p></div>
 <form id="create" class="stack" autocomplete="off">
  <div class="two">
   <div class="field"><label class="lab" for="f-name">Ton pseudo</label><input type="text" id="f-name" maxlength="18" value="${esc(f.name)}"></div>
   <div class="field"><label class="lab" for="f-nat">Nationalité</label><select id="f-nat">${NATS.map(n=>`<option ${n===f.nat?"selected":""}>${n}</option>`).join("")}</select></div>
  </div>
  <div class="field"><div class="lab">Ton rôle</div><div class="pickrow">${Object.entries(ROLES).map(([k,r])=>`<button type="button" class="pick" data-role="${k}" aria-pressed="${f.role===k}"><strong>${r.l}</strong>${r.d}</button>`).join("")}</div></div>
  <div class="field"><div class="lab">D'où tu viens</div><div class="pickrow">${Object.entries(ORIG).map(([k,o])=>`<button type="button" class="pick" data-orig="${k}" aria-pressed="${f.orig===k}"><strong>${o.l}</strong>${o.d}</button>`).join("")}</div></div>
  <div class="field"><div class="lab">Ton équipe de Challengers</div><div class="pickrow">${starters.map(([id,n,d])=>`<button type="button" class="pick" data-team="${id}" aria-pressed="${f.team===id}"><strong>${n}</strong>${d}</button>`).join("")}</div></div>
  <div><button class="btn" type="submit" id="go">Commencer ma carrière</button></div>
 </form>
 <div><button class="ghost" data-tab="maj" id="to-maj">Mises à jour du jeu (révision ${CS.active.revision})</button></div>
 <p class="fine">Jeu de fan non officiel, sans lien avec Activision ni la Call of Duty League. Vrais noms d'équipes et de joueurs, effectifs de fin octobre 2026, notes estimées. Les équipes Challengers, leurs joueurs, les salaires et les primes sont fictifs.</p>`;
}
function render(){
 const app=document.getElementById("app");
 if(!S){app.innerHTML=tab==="maj"?updView():createView();return}
 if(S.ended){app.innerHTML=endView();return}
 const body=tab==="palmares"?palmaresView():tab==="maj"?updView():tab==="equipes"?equipesView():tab==="matchs"?matchsView():tab==="classement"?classementView():carriereView();
 app.innerHTML=hud()+body;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 const d=b.dataset;
 if(d.tab){tab=d.tab;render();return}
 if(d.opt!==undefined){decide(+d.opt);return}
 if(d.sign){sign(d.sign);return}
 if(d.role||d.orig||d.team){form.name=document.getElementById("f-name").value;form.nat=document.getElementById("f-nat").value;if(d.role)form.role=d.role;if(d.orig)form.orig=d.orig;if(d.team)form.team=d.team;render();return}
 if(handleUpd(d,b))return;
 if(d.act==="ask-retire"){ui.confirm="retire";render()}
 if(d.act==="ask-reset"){ui.confirm="reset";render()}
 if(d.act==="cancel"){ui.confirm=null;render()}
 if(d.act==="retire"){ui.confirm=null;retire()}
 if(d.act==="reset"){ui.confirm=null;S=null;clearSave();tab="carriere";render();window.scrollTo&&window.scrollTo({top:0})}
});
document.addEventListener("submit",e=>{if(e.target.id!=="create")return;e.preventDefault();form.name=document.getElementById("f-name").value;form.nat=document.getElementById("f-nat").value;startCareer(form)});

boot();
</script>
